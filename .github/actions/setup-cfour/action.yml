name: Provision the approved optional CFOUR runtime
description: Verify the complete pinned CFOUR 2.1 OpenMP runtime without blocking BASE when optional installation is unavailable.
inputs:
  asset-receipt:
    description: Exact canonical receipt from authorized Codespaces private staging.
    required: false
    default: ''
  asset-receipt-sha256:
    description: Independently retained SHA-256 of the exact staging receipt.
    required: false
    default: ''
  asset-task-id:
    description: Exact task identity from the private staging receipt.
    required: false
    default: ''
  required:
    description: Set true for a dedicated CFOUR job that must fail if provisioning is unavailable.
    required: false
    default: 'false'
outputs:
  available:
    description: True only after archive, inventory, native dependencies and launcher startup verification.
    value: ${{ steps.status.outputs.available }}
  reason:
    description: Explanation when optional CFOUR provisioning is unavailable.
    value: ${{ steps.status.outputs.reason }}
  installation_report:
    description: Path to the installation status JSON; contains metadata and no licensed runtime files.
    value: ${{ steps.status.outputs.installation_report }}
runs:
  using: composite
  steps:
    - name: Require a private licensed provisioning context
      shell: bash
      env:
        REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      run: |
        set -euo pipefail
        if [[ "$REPOSITORY_PRIVATE" != true ]]; then
          echo '::error::Licensed provisioning requires a private project repository.'
          exit 1
        fi
    - name: Read the reviewed CFOUR identity
      id: identity
      continue-on-error: true
      shell: bash
      env:
        COCHEM_ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ github.token }}
        COCHEM_STAGING_RECEIPT: ${{ inputs.asset-receipt }}
        COCHEM_STAGING_RECEIPT_SHA256: ${{ inputs.asset-receipt-sha256 }}
        COCHEM_STAGING_TASK_ID: ${{ inputs.asset-task-id }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/cfour-evidence"
        echo 'COCHEM_CFOUR_AVAILABLE=false' >> "$GITHUB_ENV"
        python - <<'PY'
        import os, sys
        from pathlib import Path
        scripts = Path(os.environ['COCHEM_ACTION_PATH']).resolve().parents[2] / 'scripts'
        sys.path.insert(0, str(scripts.parent))
        from scripts.consume_private_engine_asset import load_workflow_receipt
        receipt = load_workflow_receipt('cfour')
        manifest = receipt['approved_distribution']
        fields = {
            'COCHEM_CFOUR_SCRIPTS': str(scripts),
            'COCHEM_CFOUR_ARCHIVE_NAME': manifest['archive_name'],
        }
        with open(os.environ['GITHUB_ENV'], 'a') as output:
            for key, value in fields.items():
                if any(char in value for char in '\r\n\x00'):
                    raise ValueError('Invalid distribution setting')
                output.write(f'{key}={value}\n')
        PY
    - name: Consume the exact privately staged CFOUR asset from the owning project
      id: download
      if: steps.identity.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        COCHEM_STAGING_RECEIPT: ${{ inputs.asset-receipt }}
        COCHEM_STAGING_RECEIPT_SHA256: ${{ inputs.asset-receipt-sha256 }}
        COCHEM_STAGING_TASK_ID: ${{ inputs.asset-task-id }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/cochem-cfour-download"
        python -m scripts.consume_private_engine_asset \
          --engine cfour \
          --archive "$RUNNER_TEMP/cochem-cfour-download/$COCHEM_CFOUR_ARCHIVE_NAME" \
          --descriptor "$RUNNER_TEMP/cochem-cfour-download/distribution.json" \
          --receipt-output "$RUNNER_TEMP/cfour-evidence/staging-receipt.json"
    - name: Verify and install the complete CFOUR runtime
      id: install
      if: steps.download.outcome == 'success'
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        python "$COCHEM_CFOUR_SCRIPTS/provision_cfour.py" \
          --archive "$RUNNER_TEMP/cochem-cfour-download/$COCHEM_CFOUR_ARCHIVE_NAME" \
          --manifest "$RUNNER_TEMP/cochem-cfour-download/distribution.json" \
          --install-root "$RUNNER_TEMP/cochem-cfour-install" \
          --github-env "$GITHUB_ENV" --github-path "$GITHUB_PATH" \
          > "$RUNNER_TEMP/cfour-evidence/installation.json"
        cp "$RUNNER_TEMP/cochem-cfour-install/cochem-cfour-provenance.json" \
          "$RUNNER_TEMP/cfour-evidence/distribution-provenance.json"
    - name: Record optional availability and enforce dedicated calculation requirements
      id: status
      if: always()
      shell: bash
      env:
        COCHEM_IDENTITY_OUTCOME: ${{ steps.identity.outcome }}
        COCHEM_DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        COCHEM_INSTALL_OUTCOME: ${{ steps.install.outcome }}
        COCHEM_CFOUR_REQUIRED: ${{ inputs.required }}
      run: |
        python - <<'PY'
        import json, os
        from pathlib import Path
        required = os.environ['COCHEM_CFOUR_REQUIRED']
        if required not in ('true', 'false'):
            raise SystemExit('setup-cfour required input must be true or false.')
        available = os.environ['COCHEM_INSTALL_OUTCOME'] == 'success'
        reason = ''
        if not available:
            if os.environ['COCHEM_IDENTITY_OUTCOME'] != 'success':
                reason = 'The reviewed CFOUR distribution identity could not be loaded.'
            elif os.environ['COCHEM_DOWNLOAD_OUTCOME'] != 'success':
                reason = 'The private staged CFOUR asset could not be verified in this owning project.'
            else:
                reason = 'CFOUR runtime verification or installation failed; see the provisioning step for the precise error.'
        report = Path(os.environ['RUNNER_TEMP']) / 'cfour-evidence/installation.json'
        report.parent.mkdir(parents=True, exist_ok=True)
        if not available:
            report.write_text(json.dumps({'schema_version': 1, 'available': False,
                                         'status': 'unavailable', 'reason': reason,
                                         'required': required == 'true'}, indent=2) + '\n')
            with open(os.environ['GITHUB_ENV'], 'a') as stream:
                stream.write('COCHEM_CFOUR_AVAILABLE=false\n')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
            stream.write(f'available={str(available).lower()}\n')
            stream.write(f'reason={reason}\n')
            stream.write(f'installation_report={report}\n')
        if available:
            print('Approved CFOUR runtime is available. Scientific acceptance remains a separate calculation step.')
        elif required == 'true':
            raise SystemExit('Required CFOUR provisioning failed: ' + reason)
        else:
            print('Optional CFOUR is unavailable: ' + reason)
        PY
    - name: Remove the downloaded licensed CFOUR archive
      if: always()
      shell: bash
      run: rm -rf -- "$RUNNER_TEMP/cochem-cfour-download"
