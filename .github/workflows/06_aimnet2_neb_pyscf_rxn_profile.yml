name: CHEM 312 Week 10 Reaction Profile (AIMNet2 CI-NEB + TS + IRC + PySCF PCM)

on:
  workflow_dispatch:
    inputs:
      input_dir:
        description: Relative folder containing reactant.xyz + product.xyz (or R.xyz, Int_tet.xyz, P.xyz)
        required: true
        default: examples/student_inputs/chem312_team4_rxn
        type: string
      input_name:
        description: Logical input filename stem for the sealed handoff receipt
        required: true
        default: chem312_team4_rxn.xyz
        type: string
      charge:
        description: Total molecular charge (-2, -1, 0, 1, 2)
        required: true
        default: '-1'
        type: choice
        options: ['-2', '-1', '0', '1', '2']
      multiplicity:
        description: Spin multiplicity (1, 2, 3)
        required: true
        default: '1'
        type: choice
        options: ['1', '2', '3']
      solvent_name:
        description: Implicit PCM solvent name (e.g., acetonitrile, water)
        required: true
        default: acetonitrile
        type: string
      temp_k:
        description: Temperature in Kelvin for RRHO thermochemistry
        required: true
        default: '298.15'
        type: string
      dft_basis:
        description: CPU PySCF DFT basis set (def2-TZVPP for production CHEM 312; def2-SVP for fast checks)
        required: true
        default: def2-TZVPP
        type: choice
        options: [def2-TZVPP, def2-TZVP, def2-SVP, STO-3G]
      stage:
        description: Execution stage (all = full AIMNet2 + PySCF/PCM; mlff = AIMNet2 CI-NEB/TS/IRC only; validate = stoichiometry check)
        required: true
        default: all
        type: choice
        options: [all, mlff, validate]
      course_id:
        description: Course identifier (Tennessee Tech University)
        required: true
        default: CHEM312
        type: choice
        options: [CHEM312, CHEM490, CHEM410, CHEM411]
      target_continuation:
        description: Pipeline 5.0.0 continuation lane
        required: true
        default: workstation
        type: choice
        options: [workstation, colab_gpu, gcp_spot]

permissions:
  contents: read

jobs:
  rxn_profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      INPUT_DIR: ${{ inputs.input_dir }}
      INPUT_NAME: ${{ inputs.input_name }}
      CHARGE: ${{ inputs.charge }}
      MULTIPLICITY: ${{ inputs.multiplicity }}
      SOLVENT_NAME: ${{ inputs.solvent_name }}
      TEMP_K: ${{ inputs.temp_k }}
      DFT_BASIS: ${{ inputs.dft_basis }}
      STAGE: ${{ inputs.stage }}
      COURSE_ID: ${{ inputs.course_id }}
      TARGET_CONTINUATION: ${{ inputs.target_continuation }}
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install charge-aware AIMNet2, Sella, PySCF, and CoChem-KINETIC (CPU PyTorch constrained)
        run: |
          python -m venv "$RUNNER_TEMP/kinetic"
          py="$RUNNER_TEMP/kinetic/bin/python"
          printf 'torch==2.8.0+cpu\n' > "$RUNNER_TEMP/cpu-constraints.txt"
          "$py" -m pip install --upgrade pip
          "$py" -m pip install 'torch==2.8.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          "$py" -m pip install -c "$RUNNER_TEMP/cpu-constraints.txt" --extra-index-url https://download.pytorch.org/whl/cpu \
            'aimnet>=0.2.0' 'ase>=3.22.0' 'sella>=2.3.0' 'pyscf==2.14.0' 'pyscf-dispersion>=1.0.0'
          "$py" -m pip install -c "$RUNNER_TEMP/cpu-constraints.txt" --extra-index-url https://download.pytorch.org/whl/cpu \
            'git+https://github.com/ProfJJK-CoChem/CoChem-KINETIC.git@ee7e2b6970edf0c73cae63d8f5c33bd66009bfd2'
          "$py" -c 'import torch; assert torch.version.cuda is None'
          "$RUNNER_TEMP/kinetic/bin/cochem-kinetic" rxn-profile --help > /dev/null
      - name: Stage normalized reaction-profile inputs
        run: |
          python - <<'PY'
          import os, shutil
          from pathlib import Path

          src = Path(os.environ["INPUT_DIR"])
          dst = Path(os.environ["RUNNER_TEMP"]) / "rxn_input"
          dst.mkdir(parents=True, exist_ok=True)
          if not src.is_dir():
              raise FileNotFoundError(f"Reaction input directory not found: {src}")

          def _stage_first(canonical: str, aliases: tuple[str, ...]) -> bool:
              for name in aliases:
                  cand = src / name
                  if cand.is_file():
                      shutil.copyfile(cand, dst / canonical)
                      return True
              return False

          has_r = _stage_first("R.xyz", ("R.xyz", "reactant.xyz", "Reactant.xyz"))
          has_p = _stage_first("P.xyz", ("P.xyz", "product.xyz", "Product.xyz"))
          for required, present in (("R.xyz", has_r), ("P.xyz", has_p)):
              if not present:
                  raise FileNotFoundError(
                      f"cochem-kinetic rxn-profile requires {required} (or reactant.xyz/product.xyz) in {src}; "
                      f"found {sorted(p.name for p in src.glob('*.xyz'))}"
                  )

          # Optional stationary guesses: stage only when present so cochem-kinetic auto-discovers stepwise_5pt vs elementary_3pt
          _stage_first("Int_tet.xyz", ("Int_tet.xyz", "intermediate.xyz", "int_tet.xyz"))
          for opt_name in ("TS1.xyz", "TS2.xyz", "TS.xyz"):
              cand = src / opt_name
              if cand.is_file():
                  shutil.copyfile(cand, dst / opt_name)
          print("Staged inputs:", sorted(p.name for p in dst.glob("*.xyz")))
          PY
      - name: Execute AIMNet2 CI-NEB, TS polish, IRC, and PySCF DF-wB97X-D3 + PCM
        run: |
          "$RUNNER_TEMP/kinetic/bin/cochem-kinetic" rxn-profile \
            --input-dir "$RUNNER_TEMP/rxn_input" \
            --output-dir "$RUNNER_TEMP/rxn_out" \
            --charge "$CHARGE" \
            --multiplicity "$MULTIPLICITY" \
            --solvent "$SOLVENT_NAME" \
            --temp-k "$TEMP_K" \
            --basis "$DFT_BASIS" \
            --dft-engine cpu \
            --stage "$STAGE"
      - name: Seal and verify cochem.student-handoff/2 reaction profile bundle
        run: |
          python - <<'PY'
          import json, os, shutil, sys
          from pathlib import Path

          sys.path.insert(0, "student")
          import handoff

          rxn_in = Path(os.environ["RUNNER_TEMP"]) / "rxn_input"
          rxn_out = Path(os.environ["RUNNER_TEMP"]) / "rxn_out"
          stage = Path(os.environ["RUNNER_TEMP"]) / "bundle"
          stage.mkdir(parents=True, exist_ok=True)
          run_stage = os.environ["STAGE"]
          charge = int(os.environ["CHARGE"])
          mult = int(os.environ["MULTIPLICITY"])

          starting = rxn_in / "R.xyz"
          if not starting.is_file():
              starting = rxn_in / "reactant.xyz"
          if not starting.is_file():
              raise FileNotFoundError(f"Expected starting geometry R.xyz or reactant.xyz in {rxn_in}")
          shutil.copyfile(starting, stage / "input.xyz")

          results_path = rxn_out / "results.json"
          mlff_path = rxn_out / "mlff_stage.json"
          results_data = json.loads(results_path.read_text(encoding="utf-8")) if results_path.is_file() else {}
          mlff_data = json.loads(mlff_path.read_text(encoding="utf-8")) if mlff_path.is_file() else {}

          # Locate converged stationary-state geometries produced by cochem-kinetic
          geom_dir = rxn_out / "geometries"
          if not geom_dir.is_dir():
              geom_dir = rxn_out / "mlff_geometries"

          pathway_mode = results_data.get("pathway_mode") or mlff_data.get("pathway_mode")
          input_mode = results_data.get("input_mode") or mlff_data.get("input_mode")
          sp_list = results_data.get("stationary_points") or mlff_data.get("stationary_points")
          if sp_list:
              state_order = tuple(str(s) for s in sp_list)
          elif geom_dir.is_dir() and (geom_dir / "TS.xyz").is_file() and not (geom_dir / "Int_tet.xyz").is_file():
              state_order = ("R", "TS", "P")
              pathway_mode = pathway_mode or "elementary_3pt"
          else:
              state_order = ("R", "TS1", "Int_tet", "TS2", "P")
              if pathway_mode is None and geom_dir.is_dir() and (geom_dir / "Int_tet.xyz").is_file():
                  pathway_mode = "stepwise_5pt"

          ts_state = results_data.get("primary_ts_state")
          ts_xyz = None
          if (rxn_out / "ts_polished.xyz").is_file():
              ts_xyz = rxn_out / "ts_polished.xyz"
              if not ts_state:
                  for candidate_state in ("TS", "TS2", "TS1"):
                      if geom_dir.is_dir() and (geom_dir / f"{candidate_state}.xyz").is_file():
                          ts_state = candidate_state
                          break
          if ts_xyz is None and ts_state and geom_dir.is_dir() and (geom_dir / f"{ts_state}.xyz").is_file():
              ts_xyz = geom_dir / f"{ts_state}.xyz"
          if ts_xyz is None:
              for candidate_state in ("TS", "TS2", "TS1"):
                  cand = geom_dir / f"{candidate_state}.xyz" if geom_dir.is_dir() else None
                  if cand is not None and cand.is_file():
                      ts_state = candidate_state
                      ts_xyz = cand
                      break
          if ts_xyz is None:
              for fallback in (rxn_in / "TS.xyz", rxn_in / "TS2.xyz", rxn_in / "TS1.xyz", starting):
                  if fallback.is_file():
                      ts_xyz = fallback
                      ts_state = fallback.stem
                      break
          shutil.copyfile(ts_xyz, stage / "ts_guess.xyz")
          for polished in ("ts_polished.xyz", "TS1_polished.xyz", "TS2_polished.xyz"):
              p_src = rxn_out / polished
              if p_src.is_file():
                  shutil.copyfile(p_src, stage / polished)

          # Copy individual stationary geometries and assemble ordered multi-frame reaction profile XYZ
          profile_frames: list[str] = []
          if geom_dir.is_dir():
              (stage / "geometries").mkdir(exist_ok=True)
              for st in state_order:
                  p = geom_dir / f"{st}.xyz"
                  if p.is_file():
                      shutil.copyfile(p, stage / "geometries" / f"{st}.xyz")
                      profile_frames.append(p.read_text(encoding="utf-8").strip())

          ensemble_rel = None
          cand_count = 1
          if profile_frames:
              ensemble_rel = "rxn_profile.xyz"
              (stage / ensemble_rel).write_text("\n".join(profile_frames) + "\n", encoding="utf-8")
              cand_count = len(
                  handoff.frames(
                      (stage / ensemble_rel).read_text(encoding="utf-8"),
                      charge=charge,
                      multiplicity=mult,
                  )
              )

          for extra in (
              "results.json",
              "manifest_sha256.json",
              "stationary_table.csv",
              "stationary_table.md",
              "mlff_stage.json",
              "dft_stage.json",
          ):
              src = rxn_out / extra
              if src.is_file():
                  shutil.copyfile(src, stage / extra)

          def _split_xyz_blocks(text: str) -> list[str]:
              lines = text.strip().splitlines()
              blocks: list[str] = []
              idx = 0
              while idx < len(lines):
                  n_at = int(lines[idx].strip())
                  end = idx + n_at + 2
                  blocks.append("\n".join(lines[idx:end]))
                  idx = end
              return blocks

          traj_meta: dict[str, object] = {}
          for traj_name in ("neb_path.xyz", "irc_path.xyz"):
              traj_src = rxn_out / traj_name
              if traj_src.is_file():
                  stem = traj_src.stem
                  full_sha = handoff.sha256_file(traj_src)
                  blocks = _split_xyz_blocks(traj_src.read_text(encoding="utf-8"))
                  total_n = len(blocks)
                  if total_n <= handoff.V2_MAX_FRAMES:
                      shutil.copyfile(traj_src, stage / traj_name)
                      staged_n = total_n
                  else:
                      limit = handoff.V2_MAX_FRAMES
                      indices = sorted({round(i * (total_n - 1) / (limit - 1)) for i in range(limit)})
                      sampled = [blocks[i] for i in indices]
                      (stage / traj_name).write_text("\n".join(sampled) + "\n", encoding="utf-8")
                      staged_n = len(sampled)
                  traj_meta[f"{stem}_total_frames"] = total_n
                  traj_meta[f"{stem}_staged_frames"] = staged_n
                  traj_meta[f"{stem}_full_sha256"] = full_sha

          def _valid_n_imag(val):
              return val if (isinstance(val, int) and not isinstance(val, bool) and val >= 0) else None

          n_imag = None
          results_ts_n_imag = results_data.get("ts_n_imaginary_modes")
          if _valid_n_imag(results_ts_n_imag) is not None:
              n_imag = results_ts_n_imag
          elif isinstance(results_ts_n_imag, dict):
              n_imag = _valid_n_imag(results_ts_n_imag.get(ts_state or "TS2"))
              if n_imag is None:
                  for v in results_ts_n_imag.values():
                      if _valid_n_imag(v) is not None:
                          n_imag = v
                          break
          if n_imag is None and results_data:
              st_info = results_data.get("states", {}).get(ts_state or "TS", {}) or results_data.get("states", {}).get("TS2", {})
              n_imag = _valid_n_imag(st_info.get("hessian", {}).get("thermo", {}).get("n_imag"))
          if n_imag is None and mlff_data:
              st_info = mlff_data.get("hessians", {}).get(ts_state or "TS", {}) or mlff_data.get("hessians", {}).get("TS2", {})
              n_imag = _valid_n_imag(st_info.get("thermo", {}).get("n_imag"))
          hessian_done = n_imag is not None

          if run_stage == "all":
              method_label = "AIMNet2 + DF-wB97X-D3"
              basis_label = os.environ["DFT_BASIS"]
              solv_label = "pcm"
              solvent_label = os.environ["SOLVENT_NAME"]
          elif run_stage == "mlff":
              method_label = "AIMNet2"
              basis_label = "AIMNet2-MLFF"
              solv_label = "gas"
              solvent_label = None
          else:
              method_label = "CoChem-KINETIC-Validate"
              basis_label = "none"
              solv_label = "gas"
              solvent_label = None

          metadata_block: dict[str, object] = {
              "temp_k": float(os.environ["TEMP_K"]),
              "stage": run_stage,
              "pathway_mode": pathway_mode,
              "input_mode": input_mode,
              "primary_ts_state": ts_state,
              "dft_basis": os.environ["DFT_BASIS"],
              "kinetic_revision": "ee7e2b6970edf0c73cae63d8f5c33bd66009bfd2",
              **traj_meta,
          }
          if results_ts_n_imag is not None:
              metadata_block["ts_n_imaginary_modes"] = results_ts_n_imag

          manifest = {
              "workflow_type": "rxn_profile",
              "input_name": os.environ["INPUT_NAME"],
              "charge": charge,
              "multiplicity": mult,
              "length_unit": "angstrom",
              "method": method_label,
              "basis": basis_label,
              "solvation": solv_label,
              "solvent_name": solvent_label,
              "hessian_calculated": hessian_done,
              "n_imaginary_modes": n_imag if hessian_done else None,
              "course_id": os.environ["COURSE_ID"],
              "collaborator_institution": "Tennessee Tech University",
              "target_continuation": os.environ["TARGET_CONTINUATION"],
              "starting_xyz": "input.xyz",
              "primary_xyz": "ts_guess.xyz",
              "ensemble_xyz": ensemble_rel,
              "candidate_count": cand_count,
              "selected": "ts_guess.xyz",
              "student_id": f"{os.environ['COURSE_ID'].lower()}_rxn_student",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "metadata": metadata_block,
          }
          zip_path, sha_path, _, _ = handoff.seal(stage, Path(os.environ["RUNNER_TEMP"]) / "handoff", manifest)
          handoff.verify(zip_path, sidecar_path=sha_path, destination=Path(os.environ["RUNNER_TEMP"]) / "received")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CoChem-rxn-profile-handoff-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/handoff/
          if-no-files-found: error
          retention-days: 30
