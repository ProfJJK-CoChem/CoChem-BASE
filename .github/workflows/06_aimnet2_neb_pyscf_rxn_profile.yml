name: CHEM 312 Week 10 Reaction Profile (AIMNet2 CI-NEB + TS + IRC + PySCF PCM)

on:
  workflow_dispatch:
    inputs:
      input_dir:
        description: Relative folder containing R.xyz, Int_tet.xyz, P.xyz (or reactant.xyz/product.xyz)
        required: true
        default: examples/student_inputs/chem312_team4_rxn
        type: string
      input_name:
        description: Logical input filename stem for the sealed handoff receipt
        required: true
        default: chem312_team4_rxn.xyz
        type: string
      charge:
        description: Total molecular charge (-2, -1, 0, 1, 2)
        required: true
        default: '-1'
        type: choice
        options: ['-2', '-1', '0', '1', '2']
      multiplicity:
        description: Spin multiplicity (1, 2, 3)
        required: true
        default: '1'
        type: choice
        options: ['1', '2', '3']
      solvent_name:
        description: Implicit PCM solvent name (e.g., acetonitrile, water)
        required: true
        default: acetonitrile
        type: string
      temp_k:
        description: Temperature in Kelvin for RRHO thermochemistry
        required: true
        default: '298.15'
        type: string
      dft_basis:
        description: CPU PySCF DFT basis set (def2-TZVPP for production CHEM 312; def2-SVP for fast checks)
        required: true
        default: def2-TZVPP
        type: choice
        options: [def2-TZVPP, def2-TZVP, def2-SVP, STO-3G]
      stage:
        description: Execution stage (all = full AIMNet2 + PySCF/PCM; mlff = AIMNet2 CI-NEB/TS/IRC only; validate = stoichiometry check)
        required: true
        default: all
        type: choice
        options: [all, mlff, validate]
      course_id:
        description: Course identifier (Tennessee Tech University)
        required: true
        default: CHEM312
        type: choice
        options: [CHEM312, CHEM490, CHEM410, CHEM411]
      target_continuation:
        description: Pipeline 5.0.0 continuation lane
        required: true
        default: colab_gpu
        type: choice
        options: [colab_gpu, workstation, gcp_spot]

permissions:
  contents: read

jobs:
  rxn_profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      INPUT_DIR: ${{ inputs.input_dir }}
      INPUT_NAME: ${{ inputs.input_name }}
      CHARGE: ${{ inputs.charge }}
      MULTIPLICITY: ${{ inputs.multiplicity }}
      SOLVENT_NAME: ${{ inputs.solvent_name }}
      TEMP_K: ${{ inputs.temp_k }}
      DFT_BASIS: ${{ inputs.dft_basis }}
      STAGE: ${{ inputs.stage }}
      COURSE_ID: ${{ inputs.course_id }}
      TARGET_CONTINUATION: ${{ inputs.target_continuation }}
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install charge-aware AIMNet2, Sella, PySCF, and CoChem-KINETIC (CPU PyTorch constrained)
        run: |
          python -m venv "$RUNNER_TEMP/kinetic"
          py="$RUNNER_TEMP/kinetic/bin/python"
          printf 'torch==2.8.0+cpu\n' > "$RUNNER_TEMP/cpu-constraints.txt"
          "$py" -m pip install --upgrade pip
          "$py" -m pip install 'torch==2.8.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          "$py" -m pip install -c "$RUNNER_TEMP/cpu-constraints.txt" --extra-index-url https://download.pytorch.org/whl/cpu \
            'aimnet>=0.2.0' 'ase>=3.22.0' 'sella>=2.3.0' 'pyscf==2.14.0' 'pyscf-dispersion>=1.0.0'
          "$py" -m pip install -c "$RUNNER_TEMP/cpu-constraints.txt" --extra-index-url https://download.pytorch.org/whl/cpu \
            'git+https://github.com/ProfJJK-CoChem/CoChem-KINETIC.git@bd83c8c530a4241ada9fc02229bc19d7c46095c8'
          "$py" -c 'import torch; assert torch.version.cuda is None'
          "$RUNNER_TEMP/kinetic/bin/cochem-kinetic" rxn-profile --help > /dev/null
      - name: Stage normalized reaction-profile inputs
        run: |
          python - <<'PY'
          import os, shutil
          from pathlib import Path

          src = Path(os.environ["INPUT_DIR"])
          dst = Path(os.environ["RUNNER_TEMP"]) / "rxn_input"
          dst.mkdir(parents=True, exist_ok=True)
          if not src.is_dir():
              raise FileNotFoundError(f"Reaction input directory not found: {src}")

          for xyz in sorted(src.glob("*.xyz")):
              shutil.copyfile(xyz, dst / xyz.name)
          if not (dst / "R.xyz").is_file() and (dst / "reactant.xyz").is_file():
              shutil.copyfile(dst / "reactant.xyz", dst / "R.xyz")
          if not (dst / "P.xyz").is_file() and (dst / "product.xyz").is_file():
              shutil.copyfile(dst / "product.xyz", dst / "P.xyz")
          for required in ("R.xyz", "Int_tet.xyz", "P.xyz"):
              if not (dst / required).is_file():
                  raise FileNotFoundError(
                      f"cochem-kinetic rxn-profile requires {required} in {src}; found {sorted(p.name for p in dst.glob('*.xyz'))}"
                  )
          print("Staged inputs:", sorted(p.name for p in dst.glob("*.xyz")))
          PY
      - name: Execute AIMNet2 CI-NEB, TS polish, IRC, and PySCF DF-wB97X-D3 + PCM
        run: |
          "$RUNNER_TEMP/kinetic/bin/cochem-kinetic" rxn-profile \
            --input-dir "$RUNNER_TEMP/rxn_input" \
            --output-dir "$RUNNER_TEMP/rxn_out" \
            --charge "$CHARGE" \
            --multiplicity "$MULTIPLICITY" \
            --solvent "$SOLVENT_NAME" \
            --temp-k "$TEMP_K" \
            --basis "$DFT_BASIS" \
            --dft-engine cpu \
            --stage "$STAGE"
      - name: Seal and verify cochem.student-handoff/2 reaction profile bundle
        run: |
          python - <<'PY'
          import json, os, shutil, sys
          from pathlib import Path

          sys.path.insert(0, "student")
          import handoff

          rxn_in = Path(os.environ["RUNNER_TEMP"]) / "rxn_input"
          rxn_out = Path(os.environ["RUNNER_TEMP"]) / "rxn_out"
          stage = Path(os.environ["RUNNER_TEMP"]) / "bundle"
          stage.mkdir(parents=True, exist_ok=True)
          run_stage = os.environ["STAGE"]
          charge = int(os.environ["CHARGE"])
          mult = int(os.environ["MULTIPLICITY"])

          starting = rxn_in / "R.xyz"
          if not starting.is_file():
              starting = rxn_in / "reactant.xyz"
          if not starting.is_file():
              raise FileNotFoundError(f"Expected starting geometry R.xyz or reactant.xyz in {rxn_in}")
          shutil.copyfile(starting, stage / "input.xyz")

          # Locate converged stationary-state geometries produced by cochem-kinetic
          geom_dir = rxn_out / "geometries"
          if not geom_dir.is_dir():
              geom_dir = rxn_out / "mlff_geometries"

          ts_state = None
          ts_xyz = None
          for candidate_state in ("TS2", "TS1"):
              cand = geom_dir / f"{candidate_state}.xyz" if geom_dir.is_dir() else None
              if cand is not None and cand.is_file():
                  ts_state = candidate_state
                  ts_xyz = cand
                  break
          if ts_xyz is None:
              for fallback in (rxn_in / "TS2.xyz", rxn_in / "TS1.xyz", starting):
                  if fallback.is_file():
                      ts_xyz = fallback
                      ts_state = fallback.stem
                      break
          shutil.copyfile(ts_xyz, stage / "ts_guess.xyz")

          # Copy individual stationary geometries and assemble ordered multi-frame reaction profile XYZ
          state_order = ("R", "TS1", "Int_tet", "TS2", "P")
          profile_frames: list[str] = []
          if geom_dir.is_dir():
              (stage / "geometries").mkdir(exist_ok=True)
              for st in state_order:
                  p = geom_dir / f"{st}.xyz"
                  if p.is_file():
                      shutil.copyfile(p, stage / "geometries" / f"{st}.xyz")
                      profile_frames.append(p.read_text(encoding="utf-8").strip())

          ensemble_rel = None
          cand_count = 1
          if profile_frames:
              ensemble_rel = "rxn_profile.xyz"
              (stage / ensemble_rel).write_text("\n".join(profile_frames) + "\n", encoding="utf-8")
              cand_count = len(
                  handoff.frames(
                      (stage / ensemble_rel).read_text(encoding="utf-8"),
                      charge=charge,
                      multiplicity=mult,
                  )
              )

          for extra in (
              "results.json",
              "manifest_sha256.json",
              "stationary_table.csv",
              "stationary_table.md",
              "mlff_stage.json",
              "dft_stage.json",
          ):
              src = rxn_out / extra
              if src.is_file():
                  shutil.copyfile(src, stage / extra)

          n_imag = None
          results_path = rxn_out / "results.json"
          mlff_path = rxn_out / "mlff_stage.json"
          if results_path.is_file():
              results = json.loads(results_path.read_text(encoding="utf-8"))
              st_info = results.get("states", {}).get(ts_state or "TS2", {})
              cand_imag = st_info.get("hessian", {}).get("thermo", {}).get("n_imag")
              if isinstance(cand_imag, int) and not isinstance(cand_imag, bool) and cand_imag >= 0:
                  n_imag = cand_imag
          elif mlff_path.is_file():
              mlff_data = json.loads(mlff_path.read_text(encoding="utf-8"))
              st_info = mlff_data.get("hessians", {}).get(ts_state or "TS2", {})
              cand_imag = st_info.get("thermo", {}).get("n_imag")
              if isinstance(cand_imag, int) and not isinstance(cand_imag, bool) and cand_imag >= 0:
                  n_imag = cand_imag
          hessian_done = n_imag is not None

          if run_stage == "all":
              method_label = "AIMNet2 + DF-wB97X-D3"
              basis_label = os.environ["DFT_BASIS"]
              solv_label = "pcm"
              solvent_label = os.environ["SOLVENT_NAME"]
          elif run_stage == "mlff":
              method_label = "AIMNet2"
              basis_label = "AIMNet2-MLFF"
              solv_label = "gas"
              solvent_label = None
          else:
              method_label = "CoChem-KINETIC-Validate"
              basis_label = "none"
              solv_label = "gas"
              solvent_label = None

          manifest = {
              "workflow_type": "rxn_profile",
              "input_name": os.environ["INPUT_NAME"],
              "charge": charge,
              "multiplicity": mult,
              "length_unit": "angstrom",
              "method": method_label,
              "basis": basis_label,
              "solvation": solv_label,
              "solvent_name": solvent_label,
              "hessian_calculated": hessian_done,
              "n_imaginary_modes": n_imag if hessian_done else None,
              "course_id": os.environ["COURSE_ID"],
              "collaborator_institution": "Tennessee Tech University",
              "target_continuation": os.environ["TARGET_CONTINUATION"],
              "starting_xyz": "input.xyz",
              "primary_xyz": "ts_guess.xyz",
              "ensemble_xyz": ensemble_rel,
              "candidate_count": cand_count,
              "selected": "ts_guess.xyz",
              "student_id": f"{os.environ['COURSE_ID'].lower()}_rxn_student",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "metadata": {
                  "temp_k": float(os.environ["TEMP_K"]),
                  "stage": run_stage,
                  "primary_ts_state": ts_state,
                  "dft_basis": os.environ["DFT_BASIS"],
                  "kinetic_revision": "bd83c8c530a4241ada9fc02229bc19d7c46095c8",
              },
          }
          zip_path, sha_path, _, _ = handoff.seal(stage, Path(os.environ["RUNNER_TEMP"]) / "handoff", manifest)
          handoff.verify(zip_path, sidecar_path=sha_path, destination=Path(os.environ["RUNNER_TEMP"]) / "received")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CoChem-rxn-profile-handoff-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/handoff/
          if-no-files-found: error
          retention-days: 30
