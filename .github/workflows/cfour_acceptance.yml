name: Reviewed TOPOS CFOUR first-order native diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: topos-cfour-first-order-${{ github.ref }}
  cancel-in-progress: false

jobs:
  property-diagnostic:
    if: github.event.repository.private && github.ref == 'refs/heads/codex/topos-cfour-properties-diagnostic-20261008'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TOPOS_REF: 'f8168b37585f97a0a2f21c37874fcd6bf3e40c31'
      BASE_REF: '0a8392baa498a799a1cabf922f5f5fbca8acc88d'
      TORQ_REF: '79fbb111125e50627a1a2c129888a45496f368d4'
      TOPOS_REQUIRE_BASE: '1'
      TOPOS_EXECUTION_BACKEND: base
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      QT_QPA_PLATFORM: offscreen
      COCHEM_HEADLESS: '1'
      COCHEM_CPU_ALLOCATION_POLICY: github_hosted_vcpus
    steps:
      - name: Retain the reviewed workflow and controller source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Checkout the pinned compatible BASE provider
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ProfJJK-CoChem/CoChem-BASE
          ref: '0a8392baa498a799a1cabf922f5f5fbca8acc88d'
          path: .cochem-dependencies/base
          persist-credentials: false
      - name: Checkout the pinned TOPOS implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ProfJJK-CoChem/CoChem-TOPOS
          ref: 'f8168b37585f97a0a2f21c37874fcd6bf3e40c31'
          token: ${{ secrets.COCHEM_SOURCE_READ_TOKEN || secrets.BASE_SOURCE_READ_TOKEN }}
          path: .cochem-dependencies/topos
          persist-credentials: false
      - name: Checkout the mandatory pinned TORQ consumer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ProfJJK-CoChem/CoChem-TORQ
          ref: 79fbb111125e50627a1a2c129888a45496f368d4
          token: ${{ secrets.COCHEM_SOURCE_READ_TOKEN || secrets.BASE_SOURCE_READ_TOKEN }}
          path: .cochem-dependencies/torq
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Establish exact pins and separate scratch/evidence directories
        run: |
          set -euo pipefail
          test "$(git -C .cochem-dependencies/base rev-parse HEAD)" = "$BASE_REF"
          test "$(git -C .cochem-dependencies/topos rev-parse HEAD)" = "$TOPOS_REF"
          test "$(git -C .cochem-dependencies/torq rev-parse HEAD)" = "$TORQ_REF"
          echo "COCHEM_ARTIFACT_DIR=$RUNNER_TEMP/cochem-artifacts" >> "$GITHUB_ENV"
          echo "COCHEM_CONFIG=$RUNNER_TEMP/cochem-artifacts/Registry/cochem_system_config.json" >> "$GITHUB_ENV"
          echo "COCHEM_BASE_ROOT=$RUNNER_TEMP/cochem-sources/base" >> "$GITHUB_ENV"
          echo "COCHEM_TOPOS_ROOT=$RUNNER_TEMP/cochem-sources/topos" >> "$GITHUB_ENV"
          echo "COCHEM_TORQ_ROOT=$RUNNER_TEMP/cochem-sources/torq" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install --yes build-essential libgfortran5
      - name: Provision the approved private CFOUR runtime through BASE
        uses: ./.cochem-dependencies/base/.github/actions/setup-cfour
        with:
          asset-token: ${{ secrets.PRIVATE_CFOUR_ASSET_CREDENTIAL }}
          required: 'true'
      - name: Isolate all scientific source roots from the controller BASE namespace
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cochem-sources"
          test ! -e "$COCHEM_BASE_ROOT"
          test ! -e "$COCHEM_TOPOS_ROOT"
          test ! -e "$COCHEM_TORQ_ROOT"
          mv .cochem-dependencies/base "$COCHEM_BASE_ROOT"
          mv .cochem-dependencies/topos "$COCHEM_TOPOS_ROOT"
          mv .cochem-dependencies/torq "$COCHEM_TORQ_ROOT"
      - name: Install the mandatory ecosystem and audit all eleven phases
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python "$COCHEM_TOPOS_ROOT/scripts/setup_ecosystem.py" \
            --base-root "$COCHEM_BASE_ROOT" --torq-root "$COCHEM_TORQ_ROOT" \
            --artifacts "$COCHEM_ARTIFACT_DIR" --min-disk-space-gb 1
      - name: Run the one-hour exact first-order diagnostic without fallback
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          "$COCHEM_ARTIFACT_DIR/ui-env/bin/python" "$GITHUB_WORKSPACE/scripts/accept_topos_cfour_properties.py" \
            --base-root "$COCHEM_BASE_ROOT" --base-ref "$BASE_REF" \
            --topos-root "$COCHEM_TOPOS_ROOT" --topos-ref "$TOPOS_REF" \
            --torq-root "$COCHEM_TORQ_ROOT" --torq-ref "$TORQ_REF" \
            --registry "$COCHEM_CONFIG" --artifacts "$COCHEM_ARTIFACT_DIR" \
            --work "$RUNNER_TEMP/topos-cfour-private-work" \
            --evidence "$RUNNER_TEMP/topos-cfour-property-evidence"
      - name: Retain selected scientific text and audited installation receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: topos-cfour-first-order-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/topos-cfour-property-evidence/
            ${{ runner.temp }}/cfour-evidence/installation.json
            ${{ runner.temp }}/cfour-evidence/distribution-provenance.json
            ${{ runner.temp }}/cochem-artifacts/Registry/*.json
            ${{ runner.temp }}/cochem-artifacts/setup-receipt.json
            ${{ runner.temp }}/cochem-artifacts/setup_summary.json
            ${{ runner.temp }}/cochem-artifacts/mandatory-validation.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove controlled scratch and the job-local licensed runtime
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/topos-cfour-private-work" "$RUNNER_TEMP/cochem-cfour-install" "$RUNNER_TEMP/cochem-cfour-download"
