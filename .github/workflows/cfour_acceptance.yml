name: CFOUR 2.1 calculation acceptance
run-name: CoChem CFOUR acceptance ${{ inputs.asset_task_id }}

on:
  workflow_dispatch:
    inputs:
      asset_receipt:
        description: Canonical receipt from authorized Codespaces private staging
        required: true
        type: string
      asset_receipt_sha256:
        description: Exact staging receipt SHA-256
        required: true
        type: string
      asset_task_id:
        description: Exact task identity from the receipt
        required: true
        type: string
  workflow_call:
    inputs:
      asset_receipt:
        required: true
        type: string
      asset_receipt_sha256:
        required: true
        type: string
      asset_task_id:
        required: true
        type: string
      base_repository:
        description: Repository containing the reviewed BASE source for a reusable call.
        required: false
        default: ProfJJK-CoChem/CoChem-BASE
        type: string
      base_ref:
        description: Full CoChem-BASE commit SHA providing the shared installer and BASE acceptance.
        required: true
        type: string

    secrets:
      BASE_SOURCE_READ_TOKEN:
        description: Optional read-only access to an explicitly selected private BASE source.
        required: false

permissions:
  contents: read

concurrency:
  group: cfour-acceptance-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-private-project:
    name: Validate owning private project and staged asset inputs
    if: ${{ github.event.repository.private && github.event.repository.owner.type == 'User' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the owning private project and explicit dispatch
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          REPOSITORY_OWNER_TYPE: ${{ github.event.repository.owner.type }}
          EXECUTION_EVENT: ${{ github.event_name }}
          COCHEM_STAGING_RECEIPT: ${{ inputs.asset_receipt }}
          COCHEM_STAGING_RECEIPT_SHA256: ${{ inputs.asset_receipt_sha256 }}
          COCHEM_STAGING_TASK_ID: ${{ inputs.asset_task_id }}
        run: |
          set -euo pipefail
          if [[ "$REPOSITORY_PRIVATE" != true ]]; then
            echo '::error::Licensed calculations require a private project repository.'
            exit 1
          fi
          if [[ "$REPOSITORY_OWNER_TYPE" != User ]]; then
            echo '::error::Licensed calculations require the owning personal private project.'
            exit 1
          fi
          if [[ "$EXECUTION_EVENT" != workflow_dispatch ]]; then
            echo '::error::Licensed calculations require an explicit workflow dispatch.'
            exit 1
          fi
          if [[ -z "$COCHEM_STAGING_RECEIPT" || ! "$COCHEM_STAGING_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ || ! "$COCHEM_STAGING_TASK_ID" =~ ^[0-9a-f]{32}$ ]]; then
            echo '::error::Supply the exact privately staged receipt, SHA-256 and task identity.'
            exit 1
          fi
  licensed-calculations:
    needs: validate-private-project
    if: ${{ github.event.repository.private && github.event.repository.owner.type == 'User' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      QT_QPA_PLATFORM: offscreen
      COCHEM_HEADLESS: '1'
      COCHEM_CPU_ALLOCATION_POLICY: github_hosted_vcpus
    steps:
      - name: Validate a reusable caller's BASE revision
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          if [[ -n "$BASE_REF" && ! "$BASE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo '::error::Reusable callers must pin base_ref to a full CoChem-BASE commit SHA.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.base_repository || github.repository }}
          ref: ${{ inputs.base_ref || github.sha }}
          token: ${{ secrets.BASE_SOURCE_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record the real runner CPU topology and scheduling limits
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          limits = {}
          for name in ('cpu.max', 'cpuset.cpus.effective'):
              path = Path('/sys/fs/cgroup') / name
              limits[name] = path.read_text().strip() if path.is_file() else None
          topology = subprocess.run(['lscpu', '--json'], capture_output=True, text=True, check=True, timeout=10)
          print(json.dumps({'runner_environment': os.environ.get('RUNNER_ENVIRONMENT'),
              'cpu_allocation_policy': os.environ.get('COCHEM_CPU_ALLOCATION_POLICY'),
              'logical_cpus': os.cpu_count(), 'affinity_cpu_ids': sorted(os.sched_getaffinity(0)),
              'kernel_limits': limits, 'lscpu': json.loads(topology.stdout)}, indent=2))
          PY
      - name: Prepare external evidence and registry locations
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cfour-evidence"
          echo "COCHEM_ARTIFACT_DIR=$RUNNER_TEMP/cochem-artifacts" >> "$GITHUB_ENV"
          echo "COCHEM_CONFIG=$RUNNER_TEMP/cochem-artifacts/Registry/cochem_system_config.json" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$RUNNER_TEMP/cfour-evidence/base-commit.txt"
      - name: Audit the checked-out BASE source
        run: python -I -S ci_tools/base_ci.py audit --output "$RUNNER_TEMP/cfour-evidence/source-audit"
      - name: Install the approved runtime's native prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgfortran5
      - name: Check that optional provisioning tolerates an absent staging receipt
        id: optional-cfour
        uses: ./.github/actions/setup-cfour
      - name: Retain and verify the optional unavailable result
        env:
          OPTIONAL_CFOUR_AVAILABLE: ${{ steps.optional-cfour.outputs.available }}
        run: |
          set -euo pipefail
          test "$OPTIONAL_CFOUR_AVAILABLE" = false
          cp "$RUNNER_TEMP/cfour-evidence/installation.json" "$RUNNER_TEMP/cfour-evidence/optional-installation-unavailable.json"
      - name: Install the checksum-pinned private CFOUR runtime
        uses: ./.github/actions/setup-cfour
        with:
          asset-receipt: ${{ inputs.asset_receipt }}
          asset-receipt-sha256: ${{ inputs.asset_receipt_sha256 }}
          asset-task-id: ${{ inputs.asset_task_id }}
          required: 'true'
      - name: Install BASE and execute all eleven Stage 0 phases
        run: |
          set -euo pipefail
          if python scripts/hosted_dashboard.py setup --min-disk-space-gb 1 \
              > "$RUNNER_TEMP/cfour-evidence/stage0-setup.log" 2>&1; then
            tail -n 30 "$RUNNER_TEMP/cfour-evidence/stage0-setup.log"
          else
            status=$?
            tail -n 100 "$RUNNER_TEMP/cfour-evidence/stage0-setup.log"
            exit "$status"
          fi
      - name: Record the fresh registry CPU allocation evidence
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          registry = json.loads(Path(os.environ['COCHEM_CONFIG']).read_text())
          report = json.dumps({'hardware': registry['hardware'],
              'cpu_allocation': (registry.get('execution') or {}).get('cpu_allocation')}, indent=2)
          (Path(os.environ['RUNNER_TEMP']) / 'cfour-evidence/cpu-allocation.json').write_text(report + '\n')
          print(report)
          PY
      - name: Run real CFOUR energies, gradients, optimization, harmonic and OpenMP acceptance
        run: |
          set -euo pipefail
          "$COCHEM_ARTIFACT_DIR/ui-env/bin/python" scripts/verify_cfour_scientific.py \
            --registry "$COCHEM_CONFIG" \
            --output "$RUNNER_TEMP/cfour-evidence/scientific-acceptance.json"
      - name: Validate input isotopologue identity through native harmonics and ingestion
        run: |
          "$COCHEM_ARTIFACT_DIR/ui-env/bin/python" scripts/verify_srs_completion.py \
            --engine cfour --registry "$COCHEM_CONFIG" \
            --output "$RUNNER_TEMP/cfour-evidence/srs-completion.json"
      - name: Retain scientific results and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfour-2.1-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cfour-evidence/**/*.json
            ${{ runner.temp }}/cfour-evidence/**/*.txt
            ${{ runner.temp }}/cfour-evidence/**/*.log
            ${{ runner.temp }}/cfour-evidence/**/*.xyz
            ${{ runner.temp }}/cfour-evidence/**/*.dat
            ${{ runner.temp }}/cfour-evidence/**/*.sha256
            ${{ runner.temp }}/cfour-evidence/**/*.h5
            ${{ runner.temp }}/cfour-evidence/**/*.npz
            ${{ runner.temp }}/cfour-evidence/**/ZMAT
            ${{ runner.temp }}/cfour-evidence/**/GRD
            ${{ runner.temp }}/cfour-evidence/**/FCMFINAL
            ${{ runner.temp }}/cfour-evidence/**/JOBARC
            ${{ runner.temp }}/cfour-evidence/**/JAINDX
            ${{ runner.temp }}/cfour-evidence/**/OPTARC
            ${{ runner.temp }}/cochem-artifacts/Registry/*.json
            ${{ runner.temp }}/cochem-artifacts/Registry/*.sha256
            !${{ runner.temp }}/cfour-evidence/**/GENBAS
            !${{ runner.temp }}/cfour-evidence/**/ECPDATA
          if-no-files-found: error
          retention-days: 14
      - name: Remove the job-local licensed CFOUR installation and download
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/cochem-cfour-install" "$RUNNER_TEMP/cochem-cfour-download"
