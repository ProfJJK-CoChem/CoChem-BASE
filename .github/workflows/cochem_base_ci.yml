name: CoChem BASE bounded CI

on:
  workflow_dispatch:
    inputs:
      native_cleanup_diagnosis:
        description: Observe four unchanged native macOS cleanup controls; diagnosis only
        type: boolean
        default: false
        required: false
  push:
    branches: [main, codex/orca-6.1.1-actions]
    paths-ignore: ['**/*.md', '.docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', '.docs/**']

env:
  PYTHONDONTWRITEBYTECODE: '1'
  COCHEM_EXPECTED_REVISION: ${{ github.sha }}

permissions:
  contents: read

concurrency:
  group: ${{ inputs.native_cleanup_diagnosis && 'native-cleanup-diagnosis' || 'base-release-ci' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-integrity:
    name: Source integrity and complete legacy inventory
    # Classroom copies receive calculation workflows, without spending the
    # course's allowance on upstream release tests after every student report.
    # Instructors can still request this complete bounded suite explicitly.
    if: github.repository == 'ProfJJK-CoChem/CoChem-BASE' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce canonical source and selected-test policy without app imports
        shell: bash
        run: python -B -I -S ci_tools/base_ci.py audit --expected-revision "$COCHEM_EXPECTED_REVISION" --output "${{ runner.temp }}/base-source-evidence"
      - name: Preserve findings, fixture provenance, and full legacy inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base-source-evidence
          path: ${{ runner.temp }}/base-source-evidence
          if-no-files-found: error

  ci-plane-contract:
    if: github.event_name != 'workflow_dispatch' || !inputs.native_cleanup_diagnosis
    name: CI controls (${{ matrix.os }})
    needs: source-integrity
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only CI-control test dependencies
        run: python -m pip install pytest psutil pyyaml setuptools wheel
      - name: Exercise actual process isolation, canonical guards, and evidence failure modes
        shell: bash
        run: python -B ci_tools/base_ci.py controls --expected-revision "$COCHEM_EXPECTED_REVISION" --output "${{ runner.temp }}/ci-controls"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-controls-${{ matrix.os }}
          path: ${{ runner.temp }}/ci-controls
          if-no-files-found: error

  installed-wheel:
    if: github.event_name != 'workflow_dispatch' || !inputs.native_cleanup_diagnosis
    name: Installed wheel (${{ matrix.os }})
    needs: source-integrity
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated build frontend
        run: python -m pip install build
      - name: Build reviewed source outside checkout and exercise fresh wheel installation
        shell: bash
        run: python -B -m scripts.verify_release_ci wheel --expected-revision "$COCHEM_EXPECTED_REVISION" --output "${{ runner.temp }}/wheel-acceptance"
      - name: Preserve wheel, dependency resolution and standalone CLI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-wheel-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/wheel-acceptance/acceptance.json
            ${{ runner.temp }}/wheel-acceptance/*.log
            ${{ runner.temp }}/wheel-acceptance/*.json
            ${{ runner.temp }}/wheel-acceptance/installed-dependencies.txt
            ${{ runner.temp }}/wheel-acceptance/dist/
            ${{ runner.temp }}/wheel-acceptance/generated-deck/
          if-no-files-found: error
          retention-days: 14

  bounded-physical-acceptance:
    name: Bounded free-engine, derivative replay and dashboard acceptance
    needs: [source-integrity, ci-plane-contract]
    uses: ./.github/workflows/low_compute_acceptance.yml

  public-ci-scope:
    name: Bounded public CI complete
    needs: [source-integrity, ci-plane-contract, installed-wheel, bounded-physical-acceptance]
    runs-on: ubuntu-24.04
    steps:
      - name: Record the precise validation scope
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          Public CI verified source integrity, cross-platform CI controls and clean wheel CLI installations, plus the bounded Linux xTB/PySCF and dashboard regression set.

          This is not the full canonical release-candidate gate. Licensed ORCA calculations run separately through the authorized ORCA acceptance workflow. Full live-engine, ML-model, QE, Slurm, GPU and native scientific readiness requires its own recorded acceptance evidence. No licensed archive token is available to these public pull-request jobs.
          SUMMARY

  actual-macos-observation:
    name: Four unchanged native lifetime controls with observational tracing
    if: github.event_name == 'workflow_dispatch' && inputs.native_cleanup_diagnosis
    needs: source-integrity
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Inspect exact committed source before diagnostic imports
        run: >-
          python -B -I -S ci_tools/base_ci.py audit
          --expected-revision "$GITHUB_SHA"
          --output "$RUNNER_TEMP/cochem-native-diagnostic-source-audit"
      - name: Install actual native control dependencies
        run: python -B -m pip install pytest psutil
      - name: Observe actual cleanup without changing original assertions or deadlines
        run: >-
          python -B -I ci_tools/run_owned_cleanup_diagnostic.py
          --expected-revision "$GITHUB_SHA"
          --output "$RUNNER_TEMP/cochem-native-cleanup-diagnosis"
      - name: Retain all observations including failed native cases
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-macos-cleanup-diagnosis-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cochem-native-diagnostic-source-audit/
            ${{ runner.temp }}/cochem-native-cleanup-diagnosis/*.json
            ${{ runner.temp }}/cochem-native-cleanup-diagnosis/process-controls/
            ${{ runner.temp }}/cochem-native-cleanup-diagnosis/descendant-origins/
            ${{ runner.temp }}/cochem-native-cleanup-diagnosis/native-observations/
          if-no-files-found: error
          retention-days: 14
