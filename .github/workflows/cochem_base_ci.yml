name: CoChem BASE alpha acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: base-alpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-integrity:
    name: Source integrity and complete legacy inventory
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce canonical source and selected-test policy without app imports
        run: python -I -S ci_tools/base_ci.py audit --output "${{ runner.temp }}/base-source-evidence"
      - name: Preserve findings, fixture provenance, and full legacy inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base-source-evidence
          path: ${{ runner.temp }}/base-source-evidence
          if-no-files-found: error

  ci-plane-contract:
    name: CI controls (${{ matrix.os }})
    needs: source-integrity
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only CI-control test dependencies
        run: python -m pip install pytest psutil pyyaml
      - name: Exercise actual process isolation, canonical guards, and evidence failure modes
        run: python ci_tools/base_ci.py controls --output "${{ runner.temp }}/ci-controls"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-controls-${{ matrix.os }}
          path: ${{ runner.temp }}/ci-controls
          if-no-files-found: error

  bounded-physical-acceptance:
    name: Free-engine and dashboard acceptance
    needs: [source-integrity, ci-plane-contract]
    uses: ./.github/workflows/low_compute_acceptance.yml
