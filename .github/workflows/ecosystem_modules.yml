name: CoChem ecosystem modules

on:
  workflow_dispatch:
    inputs:
      action:
        description: Fetch sources, install reviewed packages, or execute a request
        type: choice
        options: [fetch, install, geometry_analysis, topos_request]
        default: geometry_analysis
        required: true
      modules:
        description: Space-separated module IDs; topos_request selects only topos
        type: string
        default: topos torq
        required: true
      xyz_file:
        description: Repository-relative XYZ, exactly matching the request geometry
        type: string
        default: examples/jobs/water.xyz
      topos_request:
        description: Repository-relative complete TOPOS request JSON
        type: string
      kit_run_id:
        description: Successful same-repository workflow run containing the reviewed kit artifact
        type: string
      kit_artifact_name:
        description: Exact Actions artifact name for the reviewed kit
        type: string
      kit_subdirectory:
        description: Extracted kit subdirectory within that artifact
        type: string
        default: '.'
      engine_profile:
        description: Provisioned engines; other requested capabilities must already be audited
        type: choice
        options: [free, orca, cfour, orca-cfour]
        default: free
      installation_mode:
        description: Automatic pinned modules; legacy kit is an explicit expert compatibility route
        type: choice
        options: [automatic, legacy-kit]
        default: automatic
      receiver_timeout:
        description: Receiver seconds including verification, at least request budget (maximum 14400)
        type: number
        default: 180
permissions:
  contents: read
  actions: read

concurrency:
  group: ecosystem-modules-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  modules:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      COCHEM_HEADLESS: '1'
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      COCHEM_EXPECTED_REVISION: ${{ github.sha }}
      INSTALLATION_MODE: ${{ inputs.installation_mode || 'automatic' }}
      MODULE_ACTION: ${{ inputs.action || 'geometry_analysis' }}
      MODULE_IDS: ${{ inputs.modules || 'topos torq' }}
      MODULE_XYZ: ${{ inputs.xyz_file || 'examples/jobs/water.xyz' }}
      TOPOS_REQUEST: ${{ inputs.topos_request }}
      KIT_RUN_ID: ${{ inputs.kit_run_id }}
      KIT_ARTIFACT_NAME: ${{ inputs.kit_artifact_name }}
      KIT_SUBDIRECTORY: ${{ inputs.kit_subdirectory || '.' }}
      ENGINE_PROFILE: ${{ inputs.engine_profile || 'free' }}
      RECEIVER_TIMEOUT: ${{ inputs.receiver_timeout }}
      REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select isolated runner storage
        run: echo "COCHEM_ARTIFACT_DIR=$RUNNER_TEMP/cochem-modules" >> "$GITHUB_ENV"
      - name: Audit the checked-out BASE source before application imports
        run: python -B -I -S ci_tools/base_ci.py audit --expected-revision "$COCHEM_EXPECTED_REVISION" --output "$RUNNER_TEMP/cochem-modules/evidence/source-audit"
      - name: Validate explicit selection, request and allocation
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python - <<'PY'
          import math, os
          from pathlib import Path
          from scripts.manage_modules import load_manifest
          from scripts.module_request import hosted_topos_request, repository_member
          names = os.environ['MODULE_IDS'].split()
          action = os.environ['MODULE_ACTION']
          mode = os.environ['INSTALLATION_MODE']
          profile = os.environ['ENGINE_PROFILE']
          private = os.environ['REPOSITORY_PRIVATE'] == 'true'
          if not private:
              raise SystemExit('Module jobs require a private project repository.')
          if (os.environ['GITHUB_EVENT_NAME'] != 'workflow_dispatch'
                  or os.environ['GITHUB_REF'] != 'refs/heads/' + os.environ['DEFAULT_BRANCH']):
              raise SystemExit('Module jobs require an explicit default-branch dispatch.')
          if mode not in {'automatic', 'legacy-kit'}:
              raise SystemExit('Unsupported installation mode.')
          manifest = Path.cwd() / 'scripts' / ('module-distribution-legacy-kit-1.0.1.json' if mode == 'legacy-kit' else 'module-distribution.json')
          catalog = load_manifest(manifest)['modules']
          if not names or len(names) != len(set(names)) or any(name not in catalog for name in names):
              raise SystemExit('Select distinct module IDs from the reviewed catalog.')
          if action not in {'fetch', 'install', 'geometry_analysis', 'topos_request'}:
              raise SystemExit('Unsupported action.')
          if profile not in {'free', 'orca', 'cfour', 'orca-cfour'}:
              raise SystemExit('Unsupported engine profile.')
          timeout = float(os.environ['RECEIVER_TIMEOUT'])
          if not math.isfinite(timeout) or not 0 < timeout <= 14400:
              raise SystemExit('Receiver allocation must be finite and at most 14400 seconds.')
          selected_kit = action != 'fetch' and any(catalog[name].get('adapter') == 'topos_handoff' for name in names)
          if action != 'fetch' and any(catalog[name]['distribution'] is None or catalog[name].get('install_blocker') for name in names):
              raise SystemExit('A selected module is not installable from the reviewed catalog.')
          if profile != 'free' and (action not in {'install', 'topos_request'} or names != ['topos']):
              raise SystemExit('Licensed provisioners require an explicit TOPOS installation or request dispatch.')
          if action == 'topos_request':
              if names != ['topos']:
                  raise SystemExit('The typed request action selects TOPOS only.')
              hosted_topos_request(Path.cwd(), request_file=os.environ['TOPOS_REQUEST'], timeout=timeout, repository_private=private)
          elif os.environ['TOPOS_REQUEST']:
              raise SystemExit('A TOPOS request file requires the topos_request action.')
          if selected_kit:
              if not os.environ['KIT_RUN_ID'] or not os.environ['KIT_ARTIFACT_NAME']:
                  raise SystemExit('Select a same-repository Actions kit artifact by run ID and name.')
              relative = Path(os.environ['KIT_SUBDIRECTORY'])
              if relative.is_absolute() or '..' in relative.parts or any(char in str(relative) for char in '\r\n\x00'):
                  raise SystemExit('Kit subdirectory must remain inside the downloaded artifact.')
          elif any(os.environ[key] for key in ('KIT_RUN_ID', 'KIT_ARTIFACT_NAME')):
              raise SystemExit('Kit artifact selection requires the explicit legacy-kit installation mode.')
          if action in {'geometry_analysis', 'topos_request'}:
              source = repository_member(Path.cwd(), os.environ['MODULE_XYZ'])
              if source.stat().st_size > 2_000_000:
                  raise SystemExit('XYZ exceeds the bounded input limit.')
              if action == 'geometry_analysis' and any('geometry_analysis' not in catalog[name]['operations'] for name in names):
                  raise SystemExit('This module requires its typed request, not legacy geometry analysis.')
              lines = source.read_text(encoding='utf-8-sig').splitlines()
              if not lines or not lines[0].strip().isascii() or not lines[0].strip().isdigit():
                  raise SystemExit('XYZ requires an explicit atom count.')
              count = int(lines[0].strip())
              if not 0 < count <= 2000 or len(lines) != count + 2:
                  raise SystemExit('XYZ must contain one complete geometry of at most 2000 atoms.')
              for line in lines[2:]:
                  fields = line.split()
                  if len(fields) != 4 or not all(math.isfinite(float(value)) for value in fields[1:]):
                      raise SystemExit('XYZ requires three finite coordinates per atom.')
              # Actual BASE ingestion validates nuclides, electronic state and
              # atom order after the audited controller is installed.
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('TOPOS_SELECTED=' + ('true' if 'topos' in names else 'false') + '\n')
              output.write('KIT_SELECTED=' + ('true' if selected_kit else 'false') + '\n')
              output.write(f'MODULE_MANIFEST={manifest}\n')
          PY
      - name: Validate private ORCA asset credential selection
        if: env.ENGINE_PROFILE == 'orca' || env.ENGINE_PROFILE == 'orca-cfour'
        env:
          ASSET_CREDENTIAL_NAME: ${{ vars.COCHEM_ORCA_ACCESS_SECRET }}
          ASSET_CREDENTIAL: ${{ secrets[vars.COCHEM_ORCA_ACCESS_SECRET] }}
        run: |
          set -euo pipefail
          if [[ -z "$ASSET_CREDENTIAL_NAME" ]]; then
            echo '::error::Configure the private COCHEM_ORCA_ACCESS_SECRET variable to select an authorized project secret.'
            exit 1
          fi
          if [[ ! "$ASSET_CREDENTIAL_NAME" =~ ^[a-zA-Z_][a-zA-Z0-9_]*$ ]]; then
            echo '::error::The private asset credential selector must be a valid secret identifier.'
            exit 1
          fi
          if [[ -z "$ASSET_CREDENTIAL" ]]; then
            echo '::error::The selected private ORCA asset credential is unavailable.'
            exit 1
          fi
      - name: Validate private CFOUR asset credential selection
        if: env.ENGINE_PROFILE == 'cfour' || env.ENGINE_PROFILE == 'orca-cfour'
        env:
          ASSET_CREDENTIAL_NAME: ${{ vars.COCHEM_CFOUR_ACCESS_SECRET }}
          ASSET_CREDENTIAL: ${{ secrets[vars.COCHEM_CFOUR_ACCESS_SECRET] }}
        run: |
          set -euo pipefail
          if [[ -z "$ASSET_CREDENTIAL_NAME" ]]; then
            echo '::error::Configure the private COCHEM_CFOUR_ACCESS_SECRET variable to select an authorized project secret.'
            exit 1
          fi
          if [[ ! "$ASSET_CREDENTIAL_NAME" =~ ^[a-zA-Z_][a-zA-Z0-9_]*$ ]]; then
            echo '::error::The private asset credential selector must be a valid secret identifier.'
            exit 1
          fi
          if [[ -z "$ASSET_CREDENTIAL" ]]; then
            echo '::error::The selected private CFOUR asset credential is unavailable.'
            exit 1
          fi
      - name: Identify the protected same-repository kit artifact
        if: env.KIT_SELECTED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.hosted_module_kit identify --receipt "$COCHEM_ARTIFACT_DIR/evidence/kit-transport.json"
      - name: Download the explicitly selected kit artifact
        if: env.KIT_SELECTED == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.kit_artifact_name }}
          run-id: ${{ inputs.kit_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/cochem-kit-artifact
      - name: Verify actual artifact bytes and select the kit
        if: env.KIT_SELECTED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m scripts.hosted_module_kit verify --receipt "$COCHEM_ARTIFACT_DIR/evidence/kit-transport.json" --extracted "$RUNNER_TEMP/cochem-kit-artifact"
          python - <<'PYCODE'
          import os
          from pathlib import Path
          from scripts.module_request import repository_member
          kit = repository_member(Path(os.environ['RUNNER_TEMP']) / 'cochem-kit-artifact', os.environ['KIT_SUBDIRECTORY'], directory=True)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'ECOSYSTEM_KIT={kit}\n')
          PYCODE
      - name: Install trusted BASE as a noneditable controller
        if: env.MODULE_ACTION != 'fetch'
        run: |
          python - <<'PY'
          import subprocess, sys
          subprocess.run([sys.executable, '-m', 'pip', 'install', 'setuptools==80.9.0', 'wheel==0.45.1', 'build==1.3.0', 'packaging==25.0'], check=True)
          PY
          python -m pip install --no-build-isolation .
      - name: Verify the kit against the installed BASE catalog
        if: env.KIT_SELECTED == 'true'
        run: |
          python -I -B - <<'PYCODE'
          import json, os
          from pathlib import Path
          from scripts.manage_modules import load_manifest
          from scripts.mandatory_ecosystem import inspect_kit
          checked = inspect_kit(Path(os.environ['ECOSYSTEM_KIT']), load_manifest(Path(os.environ['MODULE_MANIFEST']))['modules']['topos'])
          proof = {'status': 'verified-kit-payload', 'source_pins': checked['pins'], 'inventory': checked['inventory'], 'scientific_execution_performed': False}
          (Path(os.environ['COCHEM_ARTIFACT_DIR']) / 'evidence/kit-preflight.json').write_text(json.dumps(proof, indent=2) + '\n')
          PYCODE
      - name: Provision approved ORCA and MPI
        if: env.ENGINE_PROFILE == 'orca' || env.ENGINE_PROFILE == 'orca-cfour'
        uses: ./.github/actions/setup-orca
        with:
          asset-token: ${{ secrets[vars.COCHEM_ORCA_ACCESS_SECRET] }}
      - name: Provision approved complete CFOUR runtime
        if: env.ENGINE_PROFILE == 'cfour' || env.ENGINE_PROFILE == 'orca-cfour'
        uses: ./.github/actions/setup-cfour
        with:
          asset-token: ${{ secrets[vars.COCHEM_CFOUR_ACCESS_SECRET] }}
          required: 'true'
      - name: Fetch or install reviewed sources and mandatory authority
        env:
          COCHEM_SOURCE_CREDENTIAL: ${{ secrets[vars.COCHEM_SOURCE_ACCESS_SECRET] }}
        run: |
          arguments=(--action "$MODULE_ACTION" --manifest "$MODULE_MANIFEST" --output "$COCHEM_ARTIFACT_DIR/evidence" --require-source-token)
          if [ "$KIT_SELECTED" = true ]; then
            arguments+=(--ecosystem-kit "$ECOSYSTEM_KIT")
          fi
          if [ "$MODULE_ACTION" = fetch ]; then
            python -B -m scripts.run_module_installation "${arguments[@]}"
          else
            python -I -B -m scripts.run_module_installation "${arguments[@]}"
          fi
      - name: Publish fresh canonical BASE calculation authority
        if: env.MODULE_ACTION == 'topos_request' && env.KIT_SELECTED != 'true'
        env:
          COCHEM_MODULES: ''
          COCHEM_STUDENT_AUTO_SETUP: '0'
        run: |
          python scripts/hosted_dashboard.py setup --artifacts "$COCHEM_ARTIFACT_DIR" --min-disk-space-gb 1
      - name: Execute the validated module request
        if: env.MODULE_ACTION == 'geometry_analysis' || env.MODULE_ACTION == 'topos_request'
        run: |
          python -I -B - <<'PY'
          import os
          from pathlib import Path
          from scripts.run_module_job import main
          root = Path(os.environ['COCHEM_ARTIFACT_DIR'])
          destination = root / 'controlled-execution'
          arguments = ['--modules', *os.environ['MODULE_IDS'].split(), '--xyz-file', str(Path(os.environ['GITHUB_WORKSPACE']) / os.environ['MODULE_XYZ']), '--output', str(destination), '--timeout', os.environ['RECEIVER_TIMEOUT'], '--manifest', os.environ['MODULE_MANIFEST'], '--root', str(root / 'Modules')]
          if os.environ['MODULE_ACTION'] == 'topos_request':
              arguments += ['--topos-request', str(Path(os.environ['GITHUB_WORKSPACE']) / os.environ['TOPOS_REQUEST'])]
              if os.environ['KIT_SELECTED'] != 'true':
                  arguments += ['--registry', str(root / 'Registry/cochem_system_config.json')]
          raise SystemExit(main(arguments))
          PY
      - name: Export only the bound scientific TOPOS snapshot
        if: always() && env.MODULE_ACTION == 'topos_request' && env.KIT_SELECTED == 'true'
        run: |
          python -I -B -m scripts.export_topos_evidence --source "$COCHEM_ARTIFACT_DIR/controlled-execution/topos" --output "$COCHEM_ARTIFACT_DIR/evidence/topos-execution" --root "$COCHEM_ARTIFACT_DIR/Modules" --manifest "$MODULE_MANIFEST"
      - name: Retain only selected canonical provider JSON reports
        if: always() && env.KIT_SELECTED != 'true' && (env.MODULE_ACTION == 'geometry_analysis' || env.MODULE_ACTION == 'topos_request')
        run: |
          python -I -B - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from scripts.export_topos_evidence import _copy_bound
          root = Path(os.environ['COCHEM_ARTIFACT_DIR'])
          destination = root / 'evidence' / 'provider-reports'
          inventory = {}
          for name in os.environ['MODULE_IDS'].split():
              source = root / 'controlled-execution' / name / 'execution'
              for member in ('result.json', 'operation.json', 'failure.json'):
                  path = source / member
                  if not path.exists() and not path.is_symlink():
                      continue
                  if path.is_symlink() or not path.is_file() or path.stat().st_size > 16 * 1024 * 1024:
                      raise ValueError('Provider report must be a bounded regular JSON file.')
                  json.loads(path.read_text(encoding='utf-8'))
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  inventory[f'{name}/{member}'] = _copy_bound(path, destination / name / member, digest)
          destination.mkdir(parents=True, exist_ok=True)
          (destination / 'retention.json').write_text(json.dumps({'files': inventory,
              'scope': 'Selected exact provider report bytes; no new scientific validation or publication authority'}, indent=2) + '\n')
          PY
      - name: Retain the actual mandatory setup audit
        if: always() && env.KIT_SELECTED == 'true'
        run: |
          python -B - <<'PY'
          import os
          from pathlib import Path
          from scripts.manage_modules import load_manifest
          from scripts.run_module_installation import retain_setup_evidence
          root = Path(os.environ['COCHEM_ARTIFACT_DIR'])
          retain_setup_evidence(load_manifest(Path(os.environ['MODULE_MANIFEST']))['modules']['topos'], root / 'Modules', root / 'evidence' / 'mandatory-setup')
          PY
      - name: Retain module execution and provenance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cochem-modules-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cochem-modules/evidence/
            ${{ runner.temp }}/orca-evidence/
            ${{ runner.temp }}/cfour-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove runner-local licensed distributions
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/cochem-orca-install" "$RUNNER_TEMP/cochem-orca-download" "$RUNNER_TEMP/cochem-cfour-install" "$RUNNER_TEMP/cochem-cfour-download"
