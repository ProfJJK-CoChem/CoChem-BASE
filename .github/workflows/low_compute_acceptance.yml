name: BASE bounded free-engine acceptance

on:
  workflow_dispatch:
  workflow_call:

env:
  PYTHONDONTWRITEBYTECODE: '1'

permissions:
  contents: read

concurrency:
  group: free-engine-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  physical-acceptance:
    name: Small xTB/PySCF calculations and bounded BASE regressions
    runs-on: ubuntu-24.04
    # Setup and dependency installation precede the separately bounded
    # regression process. Leave time for its owned cleanup and evidence upload.
    timeout-minutes: 70
    env:
      COCHEM_EXPECTED_REVISION: ${{ github.sha }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      QT_QPA_PLATFORM: offscreen
      COCHEM_HEADLESS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit the checked-out BASE source before application imports
        run: python -B -I -S ci_tools/base_ci.py audit --expected-revision "$COCHEM_EXPECTED_REVISION" --output "$RUNNER_TEMP/cochem-evidence/source-audit"
      - name: Keep calculation artifacts outside the checkout
        run: |
          echo "COCHEM_ARTIFACT_DIR=$RUNNER_TEMP/cochem-artifacts" >> "$GITHUB_ENV"
          echo "COCHEM_CONFIG=$RUNNER_TEMP/cochem-artifacts/Registry/cochem_system_config.json" >> "$GITHUB_ENV"
          echo "COCHEM_PYSCF_PYTHON=$RUNNER_TEMP/cochem-free-engines/pyscf/bin/python" >> "$GITHUB_ENV"
          echo "COCHEM_QE_PSEUDO_DIR=$RUNNER_TEMP/cochem-artifacts/free-engines/qe-paw" >> "$GITHUB_ENV"
      - name: Provision official checksum-verified Ga and As PAW input data
        run: >-
          python -B scripts/install_qe_paw_inputs.py
          --pseudo-dir "$COCHEM_QE_PSEUDO_DIR"
          --output "$RUNNER_TEMP/cochem-evidence/qe-paw-inputs.json"
      - name: Install headless Qt runtime libraries required by the packaged dashboard
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install dashboard and audit all eleven Stage 0 phases
        run: >-
          python scripts/hosted_dashboard.py setup
          --min-disk-space-gb 1
      - name: Provision verified free engines into isolated environments
        run: >-
          python scripts/install_free_engines.py
          --root "${{ runner.temp }}/cochem-free-engines"
          --engines xtb pyscf
          --output "${{ runner.temp }}/cochem-evidence/install.json"
      - name: Execute bounded physical calculations and verify numerical outputs
        run: >-
          python scripts/verify_free_engines.py
          --root "${{ runner.temp }}/cochem-free-engines"
          --engines xtb pyscf
          --output "${{ runner.temp }}/cochem-evidence/verification.json"
      - name: Publish fresh Stage 0 authority for the genuine calculation silo
        run: |
          "$COCHEM_ARTIFACT_DIR/ui-env/bin/python" - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from scripts.hosted_dashboard import runtime_environment, setup_build_environment
          artifacts = Path(os.environ['COCHEM_ARTIFACT_DIR'])
          manifest = artifacts / 'dashboard/deployment_manifest.json'
          manifest.write_text(json.dumps({'selected_repositories': ['CoChem-BASE'],
              'requested_silos': ['cochem_core_silo', 'cochem_ui_silo', 'cochem_calc_silo']}) + '\n')
          evidence = Path(os.environ['RUNNER_TEMP']) / 'cochem-evidence'
          env = setup_build_environment(runtime_environment(artifacts))
          with (evidence / 'fresh-calculation-stage0.json').open('w') as log:
              subprocess.run([str(artifacts / 'ui-env/bin/python'), 'cli.py', 'setup', '--all',
                  '--artifact-dir', str(artifacts), '--min-disk-space-gb', '1', '--json'],
                  env=env, stdout=log, stderr=subprocess.STDOUT, check=True)
          from cochem_base.core_engine.execution_authority import authorize_engine_execution
          authority = authorize_engine_execution('pyscf', registry_path=artifacts / 'Registry/cochem_system_config.json',
              cores=1, maxcore_mb=512)
          if authority.executable != str(artifacts / 'Silos/cochem_calc_silo/bin/python'):
              raise RuntimeError('Fresh PySCF authority did not bind the actual isolated calculation silo')
          PY
      - name: Verify bounded regressions with actual outcomes and unchanged source
        env:
          XTB_CMD: ${{ runner.temp }}/cochem-artifacts/free-engines/xtb/xtb-dist/bin/xtb
          XTBPATH: ${{ runner.temp }}/cochem-artifacts/free-engines/xtb/xtb-dist/share/xtb
        run: |
          test -x "$XTB_CMD"
          test -x "$COCHEM_PYSCF_PYTHON"
          "$COCHEM_ARTIFACT_DIR/ui-env/bin/python" -B -c 'import subprocess, sys, tomllib; from pathlib import Path; extras = tomllib.loads(Path("pyproject.toml").read_text())["project"]["optional-dependencies"]; requirements = extras["catalog"] + extras["scribe"]; subprocess.run([sys.executable, "-B", "-m", "pip", "install", *requirements], check=True)'
          "$COCHEM_ARTIFACT_DIR/ui-env/bin/python" -B -m scripts.verify_release_ci regressions --expected-revision "$COCHEM_EXPECTED_REVISION" --output "${{ runner.temp }}/cochem-evidence/bounded-regressions"
      - name: Verify rendered dashboard lifecycle with the audited registry
        run: |
          python scripts/hosted_dashboard.py start
          python scripts/hosted_dashboard.py check
          python scripts/hosted_dashboard.py start
      - name: Retain calculation evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-engine-acceptance-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cochem-evidence/
            ${{ runner.temp }}/cochem-artifacts/Registry/
            ${{ runner.temp }}/cochem-artifacts/dashboard/setup-validation.json
            ${{ runner.temp }}/cochem-artifacts/dashboard/setup-command.json
            ${{ runner.temp }}/cochem-artifacts/dashboard/voila.log
          if-no-files-found: error
          retention-days: 14
