name: ORCA consistent-final-COSX-grid numerical diagnostic experiment
'on':
  workflow_dispatch:
    inputs:
      topos_ref:
        description: Exactly reviewed final TOPOS source
        required: true
        default: 6227e61d819874c006e9435e327b6fb49e3befcd
        type: string
      torq_ref:
        description: Exactly reviewed mandatory TORQ source
        required: true
        default: 79fbb111125e50627a1a2c129888a45496f368d4
        type: string
      base_ref:
        description: Exactly reviewed scientific BASE source
        required: true
        default: 705b9d54370d5089da286a02b7a1c4afdcbafec1
        type: string
permissions:
  contents: read
concurrency:
  group: orca-acceptance-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  licensed-calculations:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      QT_QPA_PLATFORM: offscreen
      COCHEM_HEADLESS: '1'
      COCHEM_CPU_ALLOCATION_POLICY: github_hosted_vcpus
    steps:
    - name: Require private reviewed diagnostic source identities
      env:
        TOPOS_REF: ${{ inputs.topos_ref }}
        TORQ_REF: ${{ inputs.torq_ref }}
        CONTROLLER_PRIVATE: ${{ github.event.repository.private }}
        BASE_REF: ${{ inputs.base_ref }}
      run: |
        set -euo pipefail
        test "$CONTROLLER_PRIVATE" = true
        test "$TOPOS_REF" = 6227e61d819874c006e9435e327b6fb49e3befcd
        test "$TORQ_REF" = 79fbb111125e50627a1a2c129888a45496f368d4
        test "$BASE_REF" = 705b9d54370d5089da286a02b7a1c4afdcbafec1
    - name: Validate configured downstream source credential
      env:
        COCHEM_SOURCE_READ_TOKEN: ${{ secrets.COCHEM_SOURCE_READ_TOKEN }}
        BASE_SOURCE_READ_TOKEN: ${{ secrets.BASE_SOURCE_READ_TOKEN }}
      run: |
        if [[ -z "$COCHEM_SOURCE_READ_TOKEN" && -z "$BASE_SOURCE_READ_TOKEN" ]]; then
          echo '::error::TOPOS acceptance requires COCHEM_SOURCE_READ_TOKEN or BASE_SOURCE_READ_TOKEN exposed to this BASE workflow with private TOPOS/TORQ Contents read access.'
          exit 1
        fi
    - name: Check out the actual workflow controller only
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Retain genuine controller and job identity separately from scientific sources
      env:
        COSX_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      run: |
        python - <<'PY'
        import hashlib, json, os, shutil, subprocess
        from pathlib import Path
        root=Path(os.environ['GITHUB_WORKSPACE']);out=Path(os.environ['RUNNER_TEMP'])/'orca-evidence';out.mkdir(parents=True,exist_ok=True)
        head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
        assert head==os.environ['GITHUB_SHA']==os.environ['GITHUB_WORKFLOW_SHA']
        assert os.environ['COSX_REPOSITORY_PRIVATE']=='true'
        workflow=root/'.github/workflows/orca_acceptance.yml'
        shutil.copyfile(workflow,out/'cosx-controller-workflow.yml')
        value={'controller_head_sha':head,'workflow_sha256':hashlib.sha256(workflow.read_bytes()).hexdigest(),
               'controller_repository':os.environ['GITHUB_REPOSITORY'],'repository_private':True,
               'event':os.environ['GITHUB_EVENT_NAME'],'workflow_ref':os.environ['GITHUB_WORKFLOW_REF'],
               'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
               'scope':'Genuine job/controller observation; independently match API run/artifact identity after retrieval'}
        (out/'cosx-controller.json').write_text(json.dumps(value,indent=2)+'\n')
        PY
    - name: Check out the separately pinned scientific BASE source
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: ProfJJK-CoChem/CoChem-BASE
        ref: 705b9d54370d5089da286a02b7a1c4afdcbafec1
        path: .cochem-ecosystem/base
        persist-credentials: false
    - name: Isolate the scientific BASE checkout and require unchanged licensed provisioning
      run: |
        set -euo pipefail
        test "$(git -C .cochem-ecosystem/base rev-parse HEAD)" = 705b9d54370d5089da286a02b7a1c4afdcbafec1
        test ! -e "$RUNNER_TEMP/cochem-sources"
        mkdir -p "$RUNNER_TEMP/cochem-sources"
        mv .cochem-ecosystem/base "$RUNNER_TEMP/cochem-sources/base"
        python - <<'PY'
        import hashlib,os
        from pathlib import Path
        controller=Path(os.environ['GITHUB_WORKSPACE']);science=Path(os.environ['RUNNER_TEMP'])/'cochem-sources/base'
        for relative in ['.github/actions/setup-orca/action.yml','scripts/provision_orca.py','scripts/orca-distribution.json','scripts/install_openmpi.py']:
            assert hashlib.sha256((controller/relative).read_bytes()).hexdigest()==hashlib.sha256((science/relative).read_bytes()).hexdigest(),relative
        PY
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Record the real runner CPU topology and scheduling limits
      run: |
        python - <<'PY'
        import json, os, subprocess
        from pathlib import Path
        limits = {}
        for name in ('cpu.max', 'cpuset.cpus.effective'):
            path = Path('/sys/fs/cgroup') / name
            limits[name] = path.read_text().strip() if path.is_file() else None
        topology = subprocess.run(['lscpu', '--json'], capture_output=True, text=True, check=True, timeout=10)
        print(json.dumps({'runner_environment': os.environ.get('RUNNER_ENVIRONMENT'),
            'cpu_allocation_policy': os.environ.get('COCHEM_CPU_ALLOCATION_POLICY'),
            'logical_cpus': os.cpu_count(), 'affinity_cpu_ids': sorted(os.sched_getaffinity(0)),
            'kernel_limits': limits, 'lscpu': json.loads(topology.stdout)}, indent=2))
        PY
    - name: Prepare external evidence and registry locations
      run: |
        mkdir -p "$RUNNER_TEMP/orca-evidence"
        echo "COCHEM_ARTIFACT_DIR=$RUNNER_TEMP/cochem-artifacts" >> "$GITHUB_ENV"
        echo "COCHEM_CONFIG=$RUNNER_TEMP/cochem-artifacts/Registry/cochem_system_config.json" >> "$GITHUB_ENV"
        git rev-parse HEAD > "$RUNNER_TEMP/orca-evidence/base-commit.txt"
      working-directory: ${{ runner.temp }}/cochem-sources/base
    - name: Audit the checked-out BASE source
      run: python -I -S ci_tools/base_ci.py audit --output "$RUNNER_TEMP/orca-evidence/source-audit"
      working-directory: ${{ runner.temp }}/cochem-sources/base
    - name: Install native build prerequisites
      run: |
        sudo apt-get update
        sudo apt-get install --yes build-essential libgfortran5
    - name: Reserve disk for the complete licensed distribution
      env:
        RUNNER_HOST_KIND: ${{ runner.environment }}
      run: |
        set -euo pipefail
        if [[ "$RUNNER_HOST_KIND" != "github-hosted" || "$RUNNER_OS" != "Linux" ]]; then
          echo '::error::Preinstalled SDK cleanup is restricted to this ephemeral GitHub-hosted Linux job.'
          exit 1
        fi
        # The verified 471 MB archive expands to over 16 GiB. These unrelated
        # SDKs belong to the disposable runner image, never a user workstation.
        sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/ghc
        df -h "$RUNNER_TEMP"
    - uses: ./.github/actions/setup-orca
      with:
        asset-token: ${{ secrets.PRIVATE_ORCA_ASSET_CREDENTIAL }}
    - name: Install BASE and execute all eleven Stage 0 phases
      run: |
        if python scripts/hosted_dashboard.py setup --min-disk-space-gb 1 \
            > "$RUNNER_TEMP/orca-evidence/stage0-setup.log" 2>&1; then
          tail -n 20 "$RUNNER_TEMP/orca-evidence/stage0-setup.log"
        else
          status=$?
          tail -n 100 "$RUNNER_TEMP/orca-evidence/stage0-setup.log"
          exit "$status"
        fi
      working-directory: ${{ runner.temp }}/cochem-sources/base
    - name: Record the fresh registry CPU allocation evidence
      run: |
        python - <<'PY'
        import json, os
        from pathlib import Path
        registry = json.loads(Path(os.environ['COCHEM_CONFIG']).read_text())
        print(json.dumps({'hardware': registry['hardware'],
            'cpu_allocation': (registry.get('execution') or {}).get('cpu_allocation')}, indent=2))
        PY
    - name: Check out the reviewed TOPOS candidate
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: ProfJJK-CoChem/CoChem-TOPOS
        ref: ${{ inputs.topos_ref }}
        token: ${{ secrets.COCHEM_SOURCE_READ_TOKEN || secrets.BASE_SOURCE_READ_TOKEN }}
        path: .cochem-ecosystem/topos
        persist-credentials: false
    - name: Check out the mandatory TORQ source
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: ProfJJK-CoChem/CoChem-TORQ
        ref: ${{ inputs.torq_ref }}
        token: ${{ secrets.COCHEM_SOURCE_READ_TOKEN || secrets.BASE_SOURCE_READ_TOKEN }}
        path: .cochem-ecosystem/torq
        persist-credentials: false
    - name: Isolate and identify all mandatory source checkouts
      env:
        TOPOS_REF: ${{ inputs.topos_ref }}
        TORQ_REF: ${{ inputs.torq_ref }}
      run: |
        test "$(git -C .cochem-ecosystem/topos rev-parse HEAD)" = "$TOPOS_REF"
        test "$(git -C .cochem-ecosystem/torq rev-parse HEAD)" = "$TORQ_REF"
        test ! -e "$RUNNER_TEMP/cochem-sources/topos"
        test ! -e "$RUNNER_TEMP/cochem-sources/torq"
        mkdir -p "$RUNNER_TEMP/cochem-sources"
        mv .cochem-ecosystem/topos "$RUNNER_TEMP/cochem-sources/topos"
        mv .cochem-ecosystem/torq "$RUNNER_TEMP/cochem-sources/torq"
        git -C "$RUNNER_TEMP/cochem-sources/topos" rev-parse HEAD > "$RUNNER_TEMP/orca-evidence/topos-commit.txt"
        git -C "$RUNNER_TEMP/cochem-sources/torq" rev-parse HEAD > "$RUNNER_TEMP/orca-evidence/torq-commit.txt"
    - name: Complete mandatory package setup using the audited BASE installation
      id: mandatory
      run: |
        python "$RUNNER_TEMP/cochem-sources/topos/scripts/setup_ecosystem.py" \
          --base-root "$RUNNER_TEMP/cochem-sources/base" \
          --torq-root "$RUNNER_TEMP/cochem-sources/torq" \
          --artifacts "$COCHEM_ARTIFACT_DIR" --min-disk-space-gb 1 --existing-environment
    - name: Materialize checksum-bound authored diagnostic and reviewed probe outside source
      run: |
        python - <<'PY'
        import base64,hashlib,json,os,zlib
        from pathlib import Path
        assets={"asset-manifest.json": {"base64": "", "sha256": "f91d181c2ea3a5f151c145152b33d5bfdd9ce75f28c6e69b383015256d2a4dae"}, "expected-topos-source-manifest.json": {"base64": "", "sha256": "a32471558e23123417597d1a0fe6a9678e9dfaa676f130415c6f8983c3c2f2e3"}, "probe-authored-context.json": {"base64": "", "sha256": "ed77af575c5437cfdeab2f9a608fe9706d394da81ccfa0d9d87fa82cf40b84ff"}}
        root=Path(os.environ['RUNNER_TEMP'])/'cosx-authored'
        assert not root.exists();root.mkdir()
        for name,entry in assets.items():
            assert Path(name).name==name
            raw=zlib.decompress(base64.b64decode(entry['base64'],validate=True))
            assert hashlib.sha256(raw).hexdigest()==entry['sha256']
            (root/name).write_bytes(raw)
        runner=zlib.decompress(base64.b64decode('',validate=True))
        assert hashlib.sha256(runner).hexdigest()=='99ee46f1f336650fd6ab96ace2466b5d0e2f4549af2bf8674ee9ebcdeb0937ab'
        (Path(os.environ['RUNNER_TEMP'])/'native-cosx-probe.py').write_bytes(runner)
        PY
    - name: Record actual source, module and diagnostic script identity before native invocation
      working-directory: ${{ runner.temp }}
      env:
        COCHEM_BASE_ROOT: ${{ runner.temp }}/cochem-sources/base
        COCHEM_TOPOS_ROOT: ${{ runner.temp }}/cochem-sources/topos
        COCHEM_TORQ_ROOT: ${{ runner.temp }}/cochem-sources/torq
        COSX_CONTROLLER_PRIVATE: ${{ github.event.repository.private }}
        COSX_PROBE_SCRIPT_SHA256: 99ee46f1f336650fd6ab96ace2466b5d0e2f4549af2bf8674ee9ebcdeb0937ab
        COSX_TOPOS_COMMIT: 6227e61d819874c006e9435e327b6fb49e3befcd
        COSX_PROBE_CONTROLLER_JSON: ${{ runner.temp }}/orca-evidence/cosx-controller.json
        COSX_PROBE_SOURCE_MANIFEST: ${{ runner.temp }}/cosx-authored/expected-topos-source-manifest.json
      run: |
        "$COCHEM_ARTIFACT_DIR/ui-env/bin/python" - <<'PY'
        import hashlib, importlib.util, json, os, subprocess
        from pathlib import Path
        from topos.release import source_inventory
        runner=Path(os.environ['RUNNER_TEMP']);assets=runner/'cosx-authored';out=runner/'orca-evidence'
        assert out.is_dir();assert not (runner/'topos-cosx-probe-evidence').exists()
        assert os.environ['COSX_CONTROLLER_PRIVATE']=='true'
        assert os.environ['GITHUB_REPOSITORY']=='ProfJJK-CoChem/CoChem-BASE'
        assert os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch'
        assert os.environ['RUNNER_ENVIRONMENT']=='github-hosted'
        assert os.environ['RUNNER_OS']=='Linux' and os.environ['RUNNER_ARCH']=='X64'
        expected=source_inventory(Path(os.environ['COCHEM_TOPOS_ROOT']))
        context=json.loads((assets/'probe-authored-context.json').read_text())
        assert hashlib.sha256(json.dumps(expected,sort_keys=True,separators=(',', ':')).encode()).hexdigest()==context['source_inventory_sha256']
        script=runner/'native-cosx-probe.py'
        assert hashlib.sha256(script.read_bytes()).hexdigest()==os.environ['COSX_PROBE_SCRIPT_SHA256']
        manifest=json.loads((assets/'asset-manifest.json').read_text())
        for name,wanted in manifest['files'].items():
            assert Path(name).name==name and hashlib.sha256((assets/name).read_bytes()).hexdigest()==wanted
        roots={'topos':Path(os.environ['COCHEM_TOPOS_ROOT']),'base':Path(os.environ['COCHEM_BASE_ROOT']),'torq':Path(os.environ['COCHEM_TORQ_ROOT'])}
        for name,root in roots.items():
            assert subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip()==manifest['scientific_source_commits'][name]
        origins={}
        for package,name in [('topos','topos'),('cochem_base','base')]:
            spec=importlib.util.find_spec(package);assert spec and spec.origin
            path=Path(spec.origin).resolve();assert path.is_relative_to(roots[name])
            origins[package]={'origin_relative_to_scientific_root':path.relative_to(roots[name]).as_posix(),'sha256':hashlib.sha256(path.read_bytes()).hexdigest()}
        torq_sources=[roots['torq']/relative for relative in ['cochem_torq/__init__.py','src/cochem_torq/__init__.py']]
        torq_source=next(path for path in torq_sources if path.is_file() and not path.is_symlink())
        origins['CoChem-TORQ-declared-source']={'source_relative_to_scientific_root':torq_source.relative_to(roots['torq']).as_posix(),'sha256':hashlib.sha256(torq_source.read_bytes()).hexdigest(),'scope':'Mandatory setup source discovery only; no side-effectful consumer is imported'}
        controller=json.loads((runner/'orca-evidence/cosx-controller.json').read_text())
        assert controller['controller_head_sha']==os.environ['GITHUB_SHA']==os.environ['GITHUB_WORKFLOW_SHA']
        value={'schema_version':'topos-native-cosx-hosted-job-observation/1','scope':'Actual controller/source observations, not a native acceptance claim',
         'actual_controller':controller,'scientific_source_commits':manifest['scientific_source_commits'],
         'installed_module_origins':origins,'script_sha256':os.environ['COSX_PROBE_SCRIPT_SHA256'],
         'source_inventory':expected,'resources':{'budget_seconds':900,'threads':2,'memory_mb':2048},
         'strict_energy_gate_hartree':2e-7,'full_topos_acceptance_claimed':False,'current_source_acceptance':False,
         'actual_job':{k:os.environ[k] for k in ['GITHUB_REPOSITORY','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_SHA','GITHUB_WORKFLOW_SHA','GITHUB_EVENT_NAME','GITHUB_WORKFLOW_REF','RUNNER_ENVIRONMENT','RUNNER_OS','RUNNER_ARCH']}}
        (out/'cosx-hosted-job-source-observation.json').write_text(json.dumps(value,indent=2)+'\n')
        PY
    - name: Execute only the isolated consistent-final-COSX-grid native diagnostic
      working-directory: ${{ runner.temp }}
      env:
        COCHEM_BASE_ROOT: ${{ runner.temp }}/cochem-sources/base
        COCHEM_TOPOS_ROOT: ${{ runner.temp }}/cochem-sources/topos
        COCHEM_TORQ_ROOT: ${{ runner.temp }}/cochem-sources/torq
        COSX_CONTROLLER_PRIVATE: ${{ github.event.repository.private }}
        COSX_PROBE_SCRIPT_SHA256: 99ee46f1f336650fd6ab96ace2466b5d0e2f4549af2bf8674ee9ebcdeb0937ab
        COSX_TOPOS_COMMIT: 6227e61d819874c006e9435e327b6fb49e3befcd
        COSX_PROBE_CONTROLLER_JSON: ${{ runner.temp }}/orca-evidence/cosx-controller.json
        COSX_PROBE_SOURCE_MANIFEST: ${{ runner.temp }}/cosx-authored/expected-topos-source-manifest.json
      run: |
        "$COCHEM_ARTIFACT_DIR/ui-env/bin/python" "$RUNNER_TEMP/native-cosx-probe.py" \
          --output "$RUNNER_TEMP/topos-cosx-probe-evidence" \
          --expected-topos-sha "$COSX_TOPOS_COMMIT" \
          --budget-seconds 900 --threads 2 --memory-mb 2048
    - name: Retain isolated diagnostic raw evidence and exact authored assets
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: topos-native-cosx-grid-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/topos-cosx-probe-evidence/
          ${{ runner.temp }}/cosx-authored/
          ${{ runner.temp }}/native-cosx-probe.py
          ${{ runner.temp }}/cochem-artifacts/setup-logs/
          ${{ runner.temp }}/cochem-artifacts/setup-receipt.json
          ${{ runner.temp }}/cochem-artifacts/mandatory-validation.json
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
    - name: Retain calculation, registry and installation evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: orca-6.1.1-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
        path: |-
          ${{ runner.temp }}/orca-evidence/**/*.json
          ${{ runner.temp }}/orca-evidence/**/*.xml
          ${{ runner.temp }}/orca-evidence/**/*.txt
          ${{ runner.temp }}/orca-evidence/**/*.log
          ${{ runner.temp }}/orca-evidence/**/*.out
          ${{ runner.temp }}/orca-evidence/**/*.inp
          ${{ runner.temp }}/orca-evidence/**/*.sha256
          ${{ runner.temp }}/orca-evidence/**/complexes.h5
          ${{ runner.temp }}/cochem-openmpi-build/**/*.log
          ${{ runner.temp }}/cochem-artifacts/Registry/*.json
          ${{ runner.temp }}/cochem-artifacts/Registry/*.sha256

          ${{ runner.temp }}/orca-evidence/cosx-controller-workflow.yml
        if-no-files-found: error
        retention-days: 14
    - name: Remove the job-local licensed installation
      if: always()
      run: rm -rf -- "$RUNNER_TEMP/cochem-orca-install" "$RUNNER_TEMP/cochem-orca-download"
