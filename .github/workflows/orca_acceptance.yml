name: ORCA R2 Cartesian reference diagnostic
'on':
 workflow_dispatch:
  inputs:
   topos_ref:
    description: TOPOS pin
    required: true
    default: ef750eaaf6a990a3b9e1d65eca240ac89b6632ce
    type: string
   torq_ref:
    description: TORQ pin
    required: true
    default: 79fbb111125e50627a1a2c129888a45496f368d4
    type: string
   base_ref:
    description: BASE pin
    required: true
    default: 397d48d806d2f5fed2605cd68ca4a21dac470e23
    type: string
permissions:
 contents: read
concurrency:
 group: orca-acceptance-${{ github.repository }}-${{ github.ref }}
 cancel-in-progress: false
jobs:
 licensed-calculations:
  runs-on: ubuntu-24.04
  timeout-minutes: 330
  env: {OMP_NUM_THREADS: '1', OPENBLAS_NUM_THREADS: '1', MKL_NUM_THREADS: '1', QT_QPA_PLATFORM: offscreen, COCHEM_HEADLESS: '1', COCHEM_CPU_ALLOCATION_POLICY: github_hosted_vcpus}
  steps:
  -
   name: Validate private diagnostic pins
   env: {TOPOS_REF: '${{ inputs.topos_ref }}', TORQ_REF: '${{ inputs.torq_ref }}', CONTROLLER_PRIVATE: '${{ github.event.repository.private }}', BASE_REF: '${{ inputs.base_ref }}'}
   run: |
    set -euo pipefail
    test "$CONTROLLER_PRIVATE" = true
    test "$TOPOS_REF" = ef750eaaf6a990a3b9e1d65eca240ac89b6632ce
    test "$TORQ_REF" = 79fbb111125e50627a1a2c129888a45496f368d4
    test "$BASE_REF" = 397d48d806d2f5fed2605cd68ca4a21dac470e23
  -
   name: Validate configured downstream source credential
   env: {COCHEM_SOURCE_READ_TOKEN: '${{ secrets.COCHEM_SOURCE_READ_TOKEN }}', BASE_SOURCE_READ_TOKEN: '${{ secrets.BASE_SOURCE_READ_TOKEN }}'}
   run: |
    if [[ -z "$COCHEM_SOURCE_READ_TOKEN" && -z "$BASE_SOURCE_READ_TOKEN" ]]; then
      echo '::error::TOPOS acceptance requires COCHEM_SOURCE_READ_TOKEN or BASE_SOURCE_READ_TOKEN exposed to this BASE workflow with private TOPOS/TORQ Contents read access.'
      exit 1
    fi
  -
   name: Check out controller
   uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
   with: {ref: '${{ github.sha }}', persist-credentials: false}
  -
   name: Record controller identity
   env: {R2_REPOSITORY_PRIVATE: '${{ github.event.repository.private }}'}
   run: |
    python - <<'PY'
    import hashlib, json, os, shutil, subprocess
    from pathlib import Path
    root=Path(os.environ['GITHUB_WORKSPACE']);out=Path(os.environ['RUNNER_TEMP'])/'orca-evidence';out.mkdir(parents=True,exist_ok=True)
    head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
    assert head==os.environ['GITHUB_SHA']==os.environ['GITHUB_WORKFLOW_SHA']
    assert os.environ['R2_REPOSITORY_PRIVATE']=='true'
    workflow=root/'.github/workflows/orca_acceptance.yml'
    shutil.copyfile(workflow,out/'r2-cartesian-controller-workflow.yml')
    value={'controller_head_sha':head,'workflow_sha256':hashlib.sha256(workflow.read_bytes()).hexdigest(),
           'controller_repository':os.environ['GITHUB_REPOSITORY'],'repository_private':True,
           'event':os.environ['GITHUB_EVENT_NAME'],'workflow_ref':os.environ['GITHUB_WORKFLOW_REF'],
           'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
           'scope':'Actual controller observation; verify API run/artifact identity after retrieval'}
    (out/'r2-cartesian-controller.json').write_text(json.dumps(value,indent=2)+'\n')
    PY
  -
   name: Check out pinned BASE
   uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
   with: {repository: ProfJJK-CoChem/CoChem-BASE, ref: 397d48d806d2f5fed2605cd68ca4a21dac470e23, path: .cochem-ecosystem/base, persist-credentials: false}
  -
   name: Verify pinned BASE provisioner
   run: |
    set -euo pipefail
    test "$(git -C .cochem-ecosystem/base rev-parse HEAD)" = 397d48d806d2f5fed2605cd68ca4a21dac470e23
    test ! -e "$RUNNER_TEMP/cochem-sources"
    mkdir -p "$RUNNER_TEMP/cochem-sources"
    mv .cochem-ecosystem/base "$RUNNER_TEMP/cochem-sources/base"
    python - <<'PY'
    import hashlib,os
    from pathlib import Path
    controller=Path(os.environ['GITHUB_WORKSPACE']);science=Path(os.environ['RUNNER_TEMP'])/'cochem-sources/base'
    for relative in ['.github/actions/setup-orca/action.yml','scripts/provision_orca.py','scripts/orca-distribution.json','scripts/install_openmpi.py']:
        assert hashlib.sha256((controller/relative).read_bytes()).hexdigest()==hashlib.sha256((science/relative).read_bytes()).hexdigest(),relative
    PY
  -
   uses: actions/setup-python@v5
   with: {python-version: '3.12'}
  -
   name: Record the real runner CPU topology and scheduling limits
   run: |
    python - <<'PY'
    import json, os, subprocess
    from pathlib import Path
    limits = {}
    for name in ('cpu.max', 'cpuset.cpus.effective'):
        path = Path('/sys/fs/cgroup') / name
        limits[name] = path.read_text().strip() if path.is_file() else None
    topology = subprocess.run(['lscpu', '--json'], capture_output=True, text=True, check=True, timeout=10)
    print(json.dumps({'runner_environment': os.environ.get('RUNNER_ENVIRONMENT'),
        'cpu_allocation_policy': os.environ.get('COCHEM_CPU_ALLOCATION_POLICY'),
        'logical_cpus': os.cpu_count(), 'affinity_cpu_ids': sorted(os.sched_getaffinity(0)),
        'kernel_limits': limits, 'lscpu': json.loads(topology.stdout)}, indent=2))
    PY
  -
   name: Prepare external evidence and registry locations
   run: |
    mkdir -p "$RUNNER_TEMP/orca-evidence"
    echo "COCHEM_ARTIFACT_DIR=$RUNNER_TEMP/cochem-artifacts" >> "$GITHUB_ENV"
    echo "COCHEM_CONFIG=$RUNNER_TEMP/cochem-artifacts/Registry/cochem_system_config.json" >> "$GITHUB_ENV"
    git rev-parse HEAD > "$RUNNER_TEMP/orca-evidence/base-commit.txt"
   working-directory: ${{ runner.temp }}/cochem-sources/base
  -
   name: Audit the checked-out BASE source
   run: python -I -S ci_tools/base_ci.py audit --output "$RUNNER_TEMP/orca-evidence/source-audit"
   working-directory: ${{ runner.temp }}/cochem-sources/base
  -
   name: Install native build prerequisites
   run: |
    sudo apt-get update
    sudo apt-get install --yes build-essential libgfortran5
  -
   name: Reserve disk for the complete licensed distribution
   env: {RUNNER_HOST_KIND: '${{ runner.environment }}'}
   run: |
    set -euo pipefail
    if [[ "$RUNNER_HOST_KIND" != "github-hosted" || "$RUNNER_OS" != "Linux" ]]; then
      echo '::error::Preinstalled SDK cleanup is restricted to this ephemeral GitHub-hosted Linux job.'
      exit 1
    fi
    # The verified 471 MB archive expands to over 16 GiB. These unrelated
    # SDKs belong to the disposable runner image, never a user workstation.
    sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/ghc
    df -h "$RUNNER_TEMP"
  -
   uses: ./.github/actions/setup-orca
   with: {asset-token: '${{ secrets.PRIVATE_ORCA_ASSET_CREDENTIAL }}'}
  -
   name: Install BASE and execute all eleven Stage 0 phases
   run: |
    if python scripts/hosted_dashboard.py setup --min-disk-space-gb 1 \
        > "$RUNNER_TEMP/orca-evidence/stage0-setup.log" 2>&1; then
      tail -n 20 "$RUNNER_TEMP/orca-evidence/stage0-setup.log"
    else
      status=$?
      tail -n 100 "$RUNNER_TEMP/orca-evidence/stage0-setup.log"
      exit "$status"
    fi
   working-directory: ${{ runner.temp }}/cochem-sources/base
  -
   name: Record the fresh registry CPU allocation evidence
   run: |
    python - <<'PY'
    import json, os
    from pathlib import Path
    registry = json.loads(Path(os.environ['COCHEM_CONFIG']).read_text())
    print(json.dumps({'hardware': registry['hardware'],
        'cpu_allocation': (registry.get('execution') or {}).get('cpu_allocation')}, indent=2))
    PY
  -
   name: Check out the reviewed TOPOS candidate
   uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
   with: {repository: ProfJJK-CoChem/CoChem-TOPOS, ref: '${{ inputs.topos_ref }}', token: '${{ secrets.COCHEM_SOURCE_READ_TOKEN || secrets.BASE_SOURCE_READ_TOKEN }}', path: .cochem-ecosystem/topos, persist-credentials: false}
  -
   name: Check out the mandatory TORQ source
   uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
   with: {repository: ProfJJK-CoChem/CoChem-TORQ, ref: '${{ inputs.torq_ref }}', token: '${{ secrets.COCHEM_SOURCE_READ_TOKEN || secrets.BASE_SOURCE_READ_TOKEN }}', path: .cochem-ecosystem/torq, persist-credentials: false}
  -
   name: Isolate and identify all mandatory source checkouts
   env: {TOPOS_REF: '${{ inputs.topos_ref }}', TORQ_REF: '${{ inputs.torq_ref }}'}
   run: |
    test "$(git -C .cochem-ecosystem/topos rev-parse HEAD)" = "$TOPOS_REF"
    test "$(git -C .cochem-ecosystem/torq rev-parse HEAD)" = "$TORQ_REF"
    test ! -e "$RUNNER_TEMP/cochem-sources/topos"
    test ! -e "$RUNNER_TEMP/cochem-sources/torq"
    mkdir -p "$RUNNER_TEMP/cochem-sources"
    mv .cochem-ecosystem/topos "$RUNNER_TEMP/cochem-sources/topos"
    mv .cochem-ecosystem/torq "$RUNNER_TEMP/cochem-sources/torq"
    git -C "$RUNNER_TEMP/cochem-sources/topos" rev-parse HEAD > "$RUNNER_TEMP/orca-evidence/topos-commit.txt"
    git -C "$RUNNER_TEMP/cochem-sources/torq" rev-parse HEAD > "$RUNNER_TEMP/orca-evidence/torq-commit.txt"
  -
   name: Complete mandatory package setup using the audited BASE installation
   id: mandatory
   run: |
    python "$RUNNER_TEMP/cochem-sources/topos/scripts/setup_ecosystem.py" \
      --base-root "$RUNNER_TEMP/cochem-sources/base" \
      --torq-root "$RUNNER_TEMP/cochem-sources/torq" \
      --artifacts "$COCHEM_ARTIFACT_DIR" --min-disk-space-gb 1 --existing-environment
  -
   name: Materialize reviewed diagnostic
   run: |
    python - <<'PY'
    import ast,base64,hashlib,io,json,lzma,os,stat,subprocess,tarfile,tomllib
    from pathlib import Path
    root=Path(os.environ['RUNNER_TEMP'])/'r2-cartesian-authored'
    assert not root.exists();root.mkdir()
    packed=base64.b64decode('',validate=True)
    assert hashlib.sha256(packed).hexdigest()=='276a66199c8ca895660ce95e7617e5f9c3fabbfab6a720d98e1aa6d05d8990ab'
    expected={'probe-authored-context.json': '44d166f1deca44ddf697d5d5fa5d8aa4407b703f9b5327453388772d28bd5dd0', 'retained-reference-context.json': '3d4d63a3ce24800c0804638d27837d0c1b11351682656d3b87de6cae7063cc4a', 'initial-reference.inp': '55373862a23309f391a024e2347cce1d562be1eeb8af9b96eff6506469949999', 'original-reference-result.json': 'd3b0212a3b01db020ac926de8a24810c11c380027cc28ffa067479d6fd07c576', 'original-r2-phases.json': 'bd7cd00b6de70f7ca801b72f55b5fdd13a3b1e139c41ae236ea76337db9691b8', 'original-native-process-calls.json': 'c5feae772aa11a1e2b0a871f8abd63d060bd2cdc76f0cb1032ca3119cc9be6ac', 'predeclared-cartesian-reference.inp': 'f2cd5c4d6ed677ed2dc63f1c4a838f0c06fa209dea07c15049de5154fb6908c8', 'asset-manifest.json': '1f744c4ce3b51dda65d55ed0b949df1db843746aba24b17223c2caf3eee1858b', 'full-source-manifest-descriptors.json': '1b253ee1696c24f98598823fc432bc8b5ed113f4a33f621ad1ab3bfbea7fbfcb', 'native-r2-cartesian-probe.py': 'fe3beef09c8b93f28ca0724af8332454722b07838d1a439ad76ca076e5f6ec9e'}
    with tarfile.open(fileobj=io.BytesIO(lzma.decompress(packed))) as archive:
        members=archive.getmembers()
        assert len(members)==len(expected) and {member.name for member in members}==set(expected)
        for member in members:
            assert member.isfile() and Path(member.name).name==member.name
            raw=archive.extractfile(member).read()
            assert hashlib.sha256(raw).hexdigest()==expected[member.name]
            (root/member.name).write_bytes(raw)
    def immutable_source(owner,pin):
        source=Path(os.environ['RUNNER_TEMP'])/'cochem-sources'/owner
        original=subprocess.check_output(['git','-C',str(source),'archive',pin])
        records=subprocess.check_output(['git','-C',str(source),'ls-tree','-rz',pin])
        modes={}
        for row in filter(None,records.split(bytes([0]))):
            identity,name=row.split(bytes([9]),1);mode,kind,blob=identity.decode().split()
            assert kind=='blob' and mode in {'100644','100755'}
            modes[name.decode()]=mode
        with tarfile.open(fileobj=io.BytesIO(original)) as archive:
            files={member.name:hashlib.sha256(archive.extractfile(member).read()).hexdigest() for member in archive if member.isfile()}
        assert set(files)==set(modes)
        return {'commit':pin,'files':files,'modes':modes}
    descriptors=json.loads((root/'full-source-manifest-descriptors.json').read_text())
    for name,entry in descriptors.items():
        value=entry['metadata']
        if name=='expected-topos-source-manifest.json':
            original=immutable_source('topos',value['topos_source_commit'])
            value={**value,'files':original['files'],'modes':original['modes']}
        elif name=='expected-base-installed-payload.json':
            original=immutable_source('base',value['base_source_commit'])
            source=Path(os.environ['RUNNER_TEMP'])/'cochem-sources/base'
            project=tomllib.loads(subprocess.check_output(['git','-C',str(source),'show',value['base_source_commit']+':pyproject.toml'],text=True))
            prefixes=project['tool']['setuptools']['package-dir'];files={}
            for relative in original['files']:
                if not relative.endswith('.py'):continue
                if relative=='cli.py':files[relative]=relative;continue
                matches=[(dest,key) for key,dest in prefixes.items() if relative.startswith(dest+'/')]
                if matches:
                    dest,key=max(matches,key=lambda item:len(item[0]))
                    files[key.replace('.','/')+relative[len(dest):]]=relative
            value={**value,'files':{**files,**entry['declared_data_files']}}
        else:
            assert name=='expected-mandatory-source-manifests.json'
            value={**value,'sources':{owner:immutable_source(owner,record['commit']) for owner,record in value['sources'].items()}}
        raw=(json.dumps(value,indent=2,sort_keys=True)+'\n').encode()
        assert hashlib.sha256(raw).hexdigest()==entry['sha256']
        (root/name).write_bytes(raw)
    runner=(root/'native-r2-cartesian-probe.py').read_bytes()
    assert hashlib.sha256(runner).hexdigest()=='fe3beef09c8b93f28ca0724af8332454722b07838d1a439ad76ca076e5f6ec9e'
    (Path(os.environ['RUNNER_TEMP'])/'native-r2-cartesian-probe.py').write_bytes(runner)
    (root/'native-r2-cartesian-probe.py').unlink()  # Retain one unambiguous runtime script copy.
    # Observe every actual source byte/mode before importing any science package.
    # Execute only three reviewed pure functions from the hash-bound probe bytes.
    tree=ast.parse(runner)
    namespace=dict(globals())
    for node in tree.body:
        if isinstance(node,ast.Assign) and any(isinstance(target,ast.Name) and target.id in {'TOPOS_PIN','BASE_PIN','TORQ_PIN'} for target in node.targets):
            namespace[node.targets[0].id]=ast.literal_eval(node.value)
    def atomic_json(path,value):
        path.write_text(json.dumps(value,indent=2,sort_keys=True,allow_nan=False)+'\n')
    namespace['atomic_json']=atomic_json
    functions=[node for node in tree.body if isinstance(node,ast.FunctionDef) and node.name in {'require','sha_bytes','source_guard_observations'}]
    assert len(functions)==3
    exec(compile(ast.Module(body=functions,type_ignores=[]),'<reviewed-current-r2-source-guard>','exec'),namespace)
    for owner in ('base','topos','torq'):
        os.environ['R2_SCIENTIFIC_BASE_ROOT' if owner == 'base' else 'COCHEM_'+owner.upper()+'_ROOT']=str(Path(os.environ['RUNNER_TEMP'])/'cochem-sources'/owner)
    guard=Path(os.environ['RUNNER_TEMP'])/'orca-evidence/r2-preflight-source-guards'
    assert not guard.exists();guard.mkdir()
    observation=namespace['source_guard_observations'](root,guard)
    assert observation['passed'],'Actual source guard failed; full hashes/modes/status/diffs retained before science imports'
    PY
  -
   name: Verify source and module identities
   working-directory: ${{ runner.temp }}
   env: {R2_SCIENTIFIC_BASE_ROOT: '${{ runner.temp }}/cochem-sources/base', COCHEM_TOPOS_ROOT: '${{ runner.temp }}/cochem-sources/topos', COCHEM_TORQ_ROOT: '${{ runner.temp }}/cochem-sources/torq', R2_CONTROLLER_PRIVATE: '${{ github.event.repository.private }}', R2_PROBE_SCRIPT_SHA256: fe3beef09c8b93f28ca0724af8332454722b07838d1a439ad76ca076e5f6ec9e, R2_TOPOS_COMMIT: ef750eaaf6a990a3b9e1d65eca240ac89b6632ce, R2_PROBE_CONTROLLER_JSON: '${{ runner.temp }}/orca-evidence/r2-cartesian-controller.json', R2_PROBE_SOURCE_MANIFEST: '${{ runner.temp }}/r2-cartesian-authored/expected-topos-source-manifest.json'}
   run: |
    "$COCHEM_ARTIFACT_DIR/ui-env/bin/python" - <<'PY'
    import hashlib, importlib.util, json, os, subprocess
    from pathlib import Path
    from topos.release import source_inventory
    runner=Path(os.environ['RUNNER_TEMP']);assets=runner/'r2-cartesian-authored';out=runner/'orca-evidence'
    assert out.is_dir();assert not (runner/'topos-r2-cartesian-probe-evidence').exists()
    assert os.environ['R2_CONTROLLER_PRIVATE']=='true'
    assert os.environ['GITHUB_REPOSITORY']=='ProfJJK-CoChem/CoChem-BASE'
    assert os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch'
    assert os.environ['RUNNER_ENVIRONMENT']=='github-hosted'
    assert os.environ['RUNNER_OS']=='Linux' and os.environ['RUNNER_ARCH']=='X64'
    expected=source_inventory(Path(os.environ['COCHEM_TOPOS_ROOT']))
    context=json.loads((assets/'probe-authored-context.json').read_text())
    assert hashlib.sha256(json.dumps(expected,sort_keys=True,separators=(',', ':')).encode()).hexdigest()==context['source_inventory_sha256']
    script=runner/'native-r2-cartesian-probe.py'
    assert hashlib.sha256(script.read_bytes()).hexdigest()==os.environ['R2_PROBE_SCRIPT_SHA256']
    manifest=json.loads((assets/'asset-manifest.json').read_text())
    for name,wanted in manifest['files'].items():
        assert Path(name).name==name and hashlib.sha256((assets/name).read_bytes()).hexdigest()==wanted
    roots={'topos':Path(os.environ['COCHEM_TOPOS_ROOT']),'base':Path(os.environ['R2_SCIENTIFIC_BASE_ROOT']),'torq':Path(os.environ['COCHEM_TORQ_ROOT'])}
    for name,root in roots.items():
        assert subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip()==manifest['scientific_source_commits'][name]
    origins={}
    def origin(name,path,root):
        relative=path.relative_to(root).as_posix();raw=path.read_bytes()
        assert raw==subprocess.check_output(['git','-C',str(root),'show','HEAD:'+relative])
        origins[name]={'origin_relative_to_scientific_root':relative,'sha256':hashlib.sha256(raw).hexdigest()}
    spec=importlib.util.find_spec('topos');assert spec and spec.origin
    path=Path(spec.origin).resolve();assert path==roots['topos']/'topos/__init__.py'
    origin('topos',path,roots['topos'])
    import importlib.util as loader
    spec=loader.spec_from_file_location('reviewed_current_r2_install_binding',script)
    probe=loader.module_from_spec(spec);spec.loader.exec_module(probe)
    installed=probe.installed_base_identity(out)
    origins['cochem_base_namespace']={'origin':None,'search_locations':installed['namespace_search_locations']}
    for name in ['cochem_base.cochem_core_registry_schema','cochem_base.core_engine.engine_environment','cochem_base.concurrency.subprocess_broker']:
        module=__import__(name,fromlist=['__name__']);path=Path(module.__file__).resolve()
        relative=Path(name.replace('.','/')+'.py')
        assert path==Path(installed['site_packages'])/relative
        source='src/'+relative.as_posix()
        assert path.read_bytes()==subprocess.check_output(['git','-C',str(roots['base']),'show','HEAD:'+source])
        origins[name]={'origin_relative_to_scientific_root':source,'installed_path':str(path),'sha256':hashlib.sha256(path.read_bytes()).hexdigest()}
    torq_sources=[roots['torq']/relative for relative in ['cochem_torq/__init__.py','src/cochem_torq/__init__.py']]
    torq_source=next(path for path in torq_sources if path.is_file() and not path.is_symlink())
    origin('CoChem-TORQ-declared-source',torq_source,roots['torq'])
    origins['CoChem-TORQ-declared-source']['scope']='Mandatory setup source discovery; no TORQ consumer imported'
    controller=json.loads((runner/'orca-evidence/r2-cartesian-controller.json').read_text())
    assert controller['controller_head_sha']==os.environ['GITHUB_SHA']==os.environ['GITHUB_WORKFLOW_SHA']
    value={'schema_version':'topos-native-r2-cartesian-hosted-job-observation/1','scope':'Actual controller/source observations, not a native acceptance claim',
     'actual_controller':controller,'scientific_source_commits':manifest['scientific_source_commits'],
     'installed_base_metadata':installed,'installed_module_origins':origins,'script_sha256':os.environ['R2_PROBE_SCRIPT_SHA256'],
     'source_inventory':expected,'resources':{'budget_seconds':2335.872845748001,'scientific_job_cap_seconds':2335.5776805700007,'threads':2,'memory_mb':4096,'maxcore_mb_per_rank':1536},
     'strict_energy_gate_hartree':2e-7,'full_topos_acceptance_claimed':False,'current_source_acceptance':False,
     'actual_job':{k:os.environ[k] for k in ['GITHUB_REPOSITORY','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_SHA','GITHUB_WORKFLOW_SHA','GITHUB_EVENT_NAME','GITHUB_WORKFLOW_REF','RUNNER_ENVIRONMENT','RUNNER_OS','RUNNER_ARCH']}}
    (out/'r2-cartesian-hosted-job-source-observation.json').write_text(json.dumps(value,indent=2)+'\n')
    PY
  -
   name: Execute R2 Cartesian reference diagnostic
   working-directory: ${{ runner.temp }}
   env: {R2_SCIENTIFIC_BASE_ROOT: '${{ runner.temp }}/cochem-sources/base', COCHEM_TOPOS_ROOT: '${{ runner.temp }}/cochem-sources/topos', COCHEM_TORQ_ROOT: '${{ runner.temp }}/cochem-sources/torq', R2_CONTROLLER_PRIVATE: '${{ github.event.repository.private }}', R2_PROBE_SCRIPT_SHA256: fe3beef09c8b93f28ca0724af8332454722b07838d1a439ad76ca076e5f6ec9e, R2_TOPOS_COMMIT: ef750eaaf6a990a3b9e1d65eca240ac89b6632ce, R2_PROBE_CONTROLLER_JSON: '${{ runner.temp }}/orca-evidence/r2-cartesian-controller.json', R2_PROBE_SOURCE_MANIFEST: '${{ runner.temp }}/r2-cartesian-authored/expected-topos-source-manifest.json'}
   run: |
