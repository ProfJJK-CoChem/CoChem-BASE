name: ORCA 6.1.1 calculation acceptance
'on':
  workflow_dispatch:
    inputs:
      topos_ref:
        description: Exact reviewed current TOPOS source including native-test profile activation
        required: true
        type: string
        default: 3bb003fa6505bc392e3d9dc95d8d549929e278c0
permissions:
  contents: read
concurrency:
  group: orca-acceptance-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  licensed-calculations:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      QT_QPA_PLATFORM: offscreen
      COCHEM_HEADLESS: '1'
      COCHEM_CPU_ALLOCATION_POLICY: github_hosted_vcpus
      TOPOS_REQUIRE_BASE: '1'
      TOPOS_EXECUTION_BACKEND: base
      BLIS_NUM_THREADS: '1'
    steps:
    - name: Require exact reviewed private manual source pins
      env:
        CONTROLLER_PRIVATE: ${{ github.event.repository.private }}
        TOPOS_REF: ${{ inputs.topos_ref }}
      run: 'set -euo pipefail

        test "$CONTROLLER_PRIVATE" = true

        [[ "$TOPOS_REF" =~ ^[0-9a-f]{40}$ ]]

        test "$TOPOS_REF" = 3bb003fa6505bc392e3d9dc95d8d549929e278c0

        '
    - name: Validate configured downstream source credential
      env:
        COCHEM_SOURCE_READ_TOKEN: ${{ secrets.COCHEM_SOURCE_READ_TOKEN }}
        BASE_SOURCE_READ_TOKEN: ${{ secrets.BASE_SOURCE_READ_TOKEN }}
      run: "if [[ -z \"$COCHEM_SOURCE_READ_TOKEN\" && -z \"$BASE_SOURCE_READ_TOKEN\" ]]; then\n  echo '::error::TOPOS\
        \ acceptance requires COCHEM_SOURCE_READ_TOKEN or BASE_SOURCE_READ_TOKEN exposed to this BASE workflow with\
        \ private TOPOS/TORQ Contents read access.'\n  exit 1\nfi\n"
    - name: Check out exact controller
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Record actual controller identity
      env:
        CONTROLLER_PRIVATE: ${{ github.event.repository.private }}
      run: "python - <<'PY'\nimport hashlib,json,os,shutil,subprocess\nfrom pathlib import Path\nroot=Path(os.environ['GITHUB_WORKSPACE']);out=Path(os.environ['RUNNER_TEMP'])/'orca-evidence';out.mkdir(parents=True,exist_ok=True)\n\
        head=subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip()\nassert head==os.environ['GITHUB_SHA']==os.environ['GITHUB_WORKFLOW_SHA']\n\
        assert os.environ['CONTROLLER_PRIVATE']=='true'\nworkflow=root/'.github/workflows/orca_acceptance.yml'\n\
        shutil.copyfile(workflow,out/'controller-workflow.yml')\n(out/'controller.json').write_text(json.dumps({'head_sha':head,'workflow_sha256':hashlib.sha256(workflow.read_bytes()).hexdigest(),\n\
        \ 'repository':os.environ['GITHUB_REPOSITORY'],'repository_private':True,'event':os.environ['GITHUB_EVENT_NAME'],\n\
        \ 'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'workflow_ref':os.environ['GITHUB_WORKFLOW_REF']},indent=2)+'\\\
        n')\nPY\n"
    - name: Check out exact scientific BASE F source
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: ProfJJK-CoChem/CoChem-BASE
        ref: 14202e182e1fa4f99258ed32a8ae9ba8c1c565ad
        token: ${{ secrets.BASE_SOURCE_READ_TOKEN || github.token }}
        path: .cochem-ecosystem/base
        persist-credentials: false
    - name: Verify BASE and unchanged approved licensed provisioner
      run: "set -euo pipefail\ntest \"$(git -C .cochem-ecosystem/base rev-parse HEAD)\" = 14202e182e1fa4f99258ed32a8ae9ba8c1c565ad\n\
        test ! -e \"$RUNNER_TEMP/cochem-sources\"\nmkdir -p \"$RUNNER_TEMP/cochem-sources\"\nmv .cochem-ecosystem/base\
        \ \"$RUNNER_TEMP/cochem-sources/base\"\npython - <<'PY'\nimport hashlib,os\nfrom pathlib import Path\ncontroller=Path(os.environ['GITHUB_WORKSPACE']);science=Path(os.environ['RUNNER_TEMP'])/'cochem-sources/base'\n\
        for relative in ['.github/actions/setup-orca/action.yml','scripts/provision_orca.py','scripts/orca-distribution.json','scripts/install_openmpi.py']:\n\
        \ assert hashlib.sha256((controller/relative).read_bytes()).hexdigest()==hashlib.sha256((science/relative).read_bytes()).hexdigest(),relative\n\
        PY\n"
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Record the real runner CPU topology and scheduling limits
      run: "python - <<'PY'\nimport json, os, subprocess\nfrom pathlib import Path\nlimits = {}\nfor name in ('cpu.max',\
        \ 'cpuset.cpus.effective'):\n    path = Path('/sys/fs/cgroup') / name\n    limits[name] = path.read_text().strip()\
        \ if path.is_file() else None\ntopology = subprocess.run(['lscpu', '--json'], capture_output=True, text=True,\
        \ check=True, timeout=10)\nprint(json.dumps({'runner_environment': os.environ.get('RUNNER_ENVIRONMENT'),\n\
        \    'cpu_allocation_policy': os.environ.get('COCHEM_CPU_ALLOCATION_POLICY'),\n    'logical_cpus': os.cpu_count(),\
        \ 'affinity_cpu_ids': sorted(os.sched_getaffinity(0)),\n    'kernel_limits': limits, 'lscpu': json.loads(topology.stdout)},\
        \ indent=2))\nPY\n"
      working-directory: ${{ runner.temp }}/cochem-sources/base
    - name: Prepare external evidence and registry locations
      run: 'mkdir -p "$RUNNER_TEMP/orca-evidence"

        echo "COCHEM_ARTIFACT_DIR=$RUNNER_TEMP/cochem-artifacts" >> "$GITHUB_ENV"

        echo "COCHEM_CONFIG=$RUNNER_TEMP/cochem-artifacts/Registry/cochem_system_config.json" >> "$GITHUB_ENV"

        git rev-parse HEAD > "$RUNNER_TEMP/orca-evidence/base-commit.txt"

        '
      working-directory: ${{ runner.temp }}/cochem-sources/base
    - name: Audit the checked-out BASE source
      run: python -I -S ci_tools/base_ci.py audit --output "$RUNNER_TEMP/orca-evidence/source-audit"
      working-directory: ${{ runner.temp }}/cochem-sources/base
    - name: Install native build prerequisites
      run: 'sudo apt-get update

        sudo apt-get install --yes build-essential libgfortran5

        '
      working-directory: ${{ runner.temp }}/cochem-sources/base
    - name: Reserve disk for the complete licensed distribution
      env:
        RUNNER_HOST_KIND: ${{ runner.environment }}
      run: "set -euo pipefail\nif [[ \"$RUNNER_HOST_KIND\" != \"github-hosted\" || \"$RUNNER_OS\" != \"Linux\" ]];\
        \ then\n  echo '::error::Preinstalled SDK cleanup is restricted to this ephemeral GitHub-hosted Linux job.'\n\
        \  exit 1\nfi\n# The verified 471 MB archive expands to over 16 GiB. These unrelated\n# SDKs belong to the\
        \ disposable runner image, never a user workstation.\nsudo rm -rf -- /usr/local/lib/android /usr/share/dotnet\
        \ /usr/local/.ghcup /opt/ghc\ndf -h \"$RUNNER_TEMP\"\n"
      working-directory: ${{ runner.temp }}/cochem-sources/base
    - uses: ./.github/actions/setup-orca
      with:
        asset-token: ${{ secrets.PRIVATE_ORCA_ASSET_CREDENTIAL }}
    - name: Install BASE and execute all eleven Stage 0 phases
      run: "if python scripts/hosted_dashboard.py setup --min-disk-space-gb 1 \\\n    > \"$RUNNER_TEMP/orca-evidence/stage0-setup.log\"\
        \ 2>&1; then\n  tail -n 20 \"$RUNNER_TEMP/orca-evidence/stage0-setup.log\"\nelse\n  status=$?\n  tail -n\
        \ 100 \"$RUNNER_TEMP/orca-evidence/stage0-setup.log\"\n  exit \"$status\"\nfi\n"
      working-directory: ${{ runner.temp }}/cochem-sources/base
    - name: Record the fresh registry CPU allocation evidence
      run: "python - <<'PY'\nimport json, os\nfrom pathlib import Path\nregistry = json.loads(Path(os.environ['COCHEM_CONFIG']).read_text())\n\
        print(json.dumps({'hardware': registry['hardware'],\n    'cpu_allocation': (registry.get('execution') or\
        \ {}).get('cpu_allocation')}, indent=2))\nPY\n"
      working-directory: ${{ runner.temp }}/cochem-sources/base
    - name: Run actual serial and parallel ORCA calculations through BASE
      env:
        PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      run: "\"$COCHEM_ARTIFACT_DIR/ui-env/bin/python\" -m pytest \\\n  tests/calc/test_orca_cli_execution.py \\\n\
        \  --basetemp \"$RUNNER_TEMP/orca-evidence/pytest\" \\\n  --junitxml \"$RUNNER_TEMP/orca-evidence/results.xml\"\
        \ -q\n"
      working-directory: ${{ runner.temp }}/cochem-sources/base
    - name: Validate actual staged grids, live derivatives and isotope-bound harmonics
      run: "\"$COCHEM_ARTIFACT_DIR/ui-env/bin/python\" scripts/verify_srs_completion.py \\\n  --engine orca --registry\
        \ \"$COCHEM_CONFIG\" \\\n  --output \"$RUNNER_TEMP/orca-evidence/srs-completion.json\"\n"
      working-directory: ${{ runner.temp }}/cochem-sources/base
    - name: Check out the reviewed TOPOS candidate
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: ProfJJK-CoChem/CoChem-TOPOS
        ref: 3bb003fa6505bc392e3d9dc95d8d549929e278c0
        token: ${{ secrets.COCHEM_SOURCE_READ_TOKEN || secrets.BASE_SOURCE_READ_TOKEN }}
        path: .cochem-ecosystem/topos
        persist-credentials: false
    - name: Check out the mandatory TORQ source
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: ProfJJK-CoChem/CoChem-TORQ
        ref: 79fbb111125e50627a1a2c129888a45496f368d4
        token: ${{ secrets.COCHEM_SOURCE_READ_TOKEN || secrets.BASE_SOURCE_READ_TOKEN }}
        path: .cochem-ecosystem/torq
        persist-credentials: false
    - name: Isolate and identify all mandatory source checkouts
      env:
        TOPOS_REF: 3bb003fa6505bc392e3d9dc95d8d549929e278c0
        TORQ_REF: 79fbb111125e50627a1a2c129888a45496f368d4
      run: 'test "$(git -C .cochem-ecosystem/topos rev-parse HEAD)" = "$TOPOS_REF"

        test "$(git -C .cochem-ecosystem/torq rev-parse HEAD)" = "$TORQ_REF"

        test ! -e "$RUNNER_TEMP/cochem-sources/topos"

        test ! -e "$RUNNER_TEMP/cochem-sources/torq"

        mkdir -p "$RUNNER_TEMP/cochem-sources"

        mv .cochem-ecosystem/topos "$RUNNER_TEMP/cochem-sources/topos"

        mv .cochem-ecosystem/torq "$RUNNER_TEMP/cochem-sources/torq"

        git -C "$RUNNER_TEMP/cochem-sources/topos" rev-parse HEAD > "$RUNNER_TEMP/orca-evidence/topos-commit.txt"

        git -C "$RUNNER_TEMP/cochem-sources/torq" rev-parse HEAD > "$RUNNER_TEMP/orca-evidence/torq-commit.txt"

        echo "COCHEM_BASE_ROOT=$RUNNER_TEMP/cochem-sources/base" >> "$GITHUB_ENV"

        echo "COCHEM_TOPOS_ROOT=$RUNNER_TEMP/cochem-sources/topos" >> "$GITHUB_ENV"

        echo "COCHEM_TORQ_ROOT=$RUNNER_TEMP/cochem-sources/torq" >> "$GITHUB_ENV"

        '
    - name: Complete mandatory package setup using the audited BASE installation
      id: mandatory
      run: "python \"$RUNNER_TEMP/cochem-sources/topos/scripts/setup_ecosystem.py\" \\\n  --base-root \"$RUNNER_TEMP/cochem-sources/base\"\
        \ \\\n  --torq-root \"$RUNNER_TEMP/cochem-sources/torq\" \\\n  --artifacts \"$COCHEM_ARTIFACT_DIR\" --min-disk-space-gb\
        \ 1 --existing-environment\n"
      working-directory: ${{ runner.temp }}
    - name: Materialize exact reviewed outside evidence guard
      run: "python - <<'PY'\nimport hashlib,os\nfrom pathlib import Path\ncontroller=Path(os.environ['GITHUB_WORKSPACE'])/'ci_tools/topos_current_acceptance'\n\
        out=Path(os.environ['RUNNER_TEMP'])/'orca-evidence'\nassets={'guard.py':('acceptance-evidence-guard.py','3a2f95134a7d628d11f3a06ba24b4207a028158626a2bed93c29fe4baab55eaa'),\n\
        \ 'expected-full-source-manifest.json':('expected-full-source-manifest.json','433b0982bfc99a7eea734f66098f49db0a8ca385d9cbf362ac80b0f54013cd36')}\n\
        for name,(target,wanted) in assets.items():\n source=controller/name\n assert source.is_file() and not source.is_symlink()\n\
        \ raw=source.read_bytes()\n assert hashlib.sha256(raw).hexdigest()==wanted,name\n with (out/target).open('xb')\
        \ as stream:stream.write(raw)\nPY\n"
    - name: Verify audited current source before calculations
      working-directory: ${{ runner.temp }}
      env:
        CONTROLLER_PRIVATE: ${{ github.event.repository.private }}
        GUARD_EXPECTED_SHA256: 3a2f95134a7d628d11f3a06ba24b4207a028158626a2bed93c29fe4baab55eaa
        SOURCE_MANIFEST_SHA256: 433b0982bfc99a7eea734f66098f49db0a8ca385d9cbf362ac80b0f54013cd36
      run: '"$COCHEM_ARTIFACT_DIR/ui-env/bin/python" "$RUNNER_TEMP/orca-evidence/acceptance-evidence-guard.py" --phase
        preflight --topos-commit 3bb003fa6505bc392e3d9dc95d8d549929e278c0 --output "$RUNNER_TEMP/orca-evidence"

        '
      id: native_preflight
    - name: Require genuine TOPOS ORCA scientific acceptance
      run: "\"$COCHEM_ARTIFACT_DIR/ui-env/bin/python\" \"$RUNNER_TEMP/cochem-sources/topos/scripts/accept_orca_topos.py\"\
        \ \\\n  --registry \"$COCHEM_CONFIG\" --output \"$RUNNER_TEMP/topos-orca-evidence\" \\\n  --threads 2 --memory-mb\
        \ 2048 --budget-seconds 10800 --include-counterpoise --include-goat\n"
      working-directory: ${{ runner.temp }}
    - name: Execute native correlated and anharmonic acceptance
      if: always() && steps.native_preflight.outcome == 'success'
      run: "\"$COCHEM_ARTIFACT_DIR/ui-env/bin/python\" \"$RUNNER_TEMP/cochem-sources/topos/scripts/accept_orca_extended.py\"\
        \ \\\n  --registry \"$COCHEM_CONFIG\" --output \"$RUNNER_TEMP/topos-orca-extended\" \\\n  --threads 2 --memory-mb\
        \ 4096 --budget-seconds 7200 --case 'native-hessian' --case 'native-vpt2' --case 'MP2' --case 'MP2-optimization'\
        \ --case 'CCSD(T)' --case 'AUTOCI-CCSD(T)' --case 'DLPNO-CCSD(T1)' --case 'CCSD(T)-F12D/RI' --case 'F12-MP2'\
        \ --case 'F12-RI-MP2' --case 'DLPNO-counterpoise' --case 'F12-composite'\n"
      working-directory: ${{ runner.temp }}
    - name: Retain source-bound licensed pytest results
      if: always() && steps.native_preflight.outcome == 'success'
      run: "\"$COCHEM_ARTIFACT_DIR/ui-env/bin/python\" \"$RUNNER_TEMP/cochem-sources/topos/scripts/accept_orca_pytest.py\"\
        \ \\\n  --registry \"$COCHEM_CONFIG\" --output \"$RUNNER_TEMP/topos-orca-evidence\"\n"
      working-directory: ${{ runner.temp }}
    - name: Require every native case and all three named licensed tests with zero skips
      working-directory: ${{ runner.temp }}
      env:
        CONTROLLER_PRIVATE: ${{ github.event.repository.private }}
        GUARD_EXPECTED_SHA256: 3a2f95134a7d628d11f3a06ba24b4207a028158626a2bed93c29fe4baab55eaa
        SOURCE_MANIFEST_SHA256: 433b0982bfc99a7eea734f66098f49db0a8ca385d9cbf362ac80b0f54013cd36
      run: '"$COCHEM_ARTIFACT_DIR/ui-env/bin/python" "$RUNNER_TEMP/orca-evidence/acceptance-evidence-guard.py" --phase
        postflight --topos-commit 3bb003fa6505bc392e3d9dc95d8d549929e278c0 --output "$RUNNER_TEMP/orca-evidence"

        '
      if: always() && steps.native_preflight.outcome == 'success'
    - name: Retain TOPOS native calculation and setup evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: topos-orca-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ runner.temp }}/topos-orca-evidence/

          ${{ runner.temp }}/topos-orca-extended/

          ${{ runner.temp }}/cochem-artifacts/setup-logs/

          ${{ runner.temp }}/cochem-artifacts/setup-receipt.json

          ${{ runner.temp }}/cochem-artifacts/mandatory-validation.json


          ${{ runner.temp }}/cochem-artifacts/Registry/*.json

          '
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
    - name: Retain calculation, registry and installation evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: orca-6.1.1-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ runner.temp }}/orca-evidence/**/*.json

          ${{ runner.temp }}/orca-evidence/**/*.xml

          ${{ runner.temp }}/orca-evidence/**/*.txt

          ${{ runner.temp }}/orca-evidence/**/*.log

          ${{ runner.temp }}/orca-evidence/**/*.out

          ${{ runner.temp }}/orca-evidence/**/*.inp

          ${{ runner.temp }}/orca-evidence/**/*.xyz

          ${{ runner.temp }}/orca-evidence/**/*.gbw

          ${{ runner.temp }}/orca-evidence/**/*.npz

          ${{ runner.temp }}/orca-evidence/**/*.hess

          ${{ runner.temp }}/orca-evidence/**/*.engrad

          ${{ runner.temp }}/orca-evidence/**/*.sha256

          ${{ runner.temp }}/orca-evidence/**/*.h5

          ${{ runner.temp }}/orca-evidence/**/gradient

          ${{ runner.temp }}/cochem-openmpi-build/**/*.log

          ${{ runner.temp }}/cochem-artifacts/Registry/*.json

          ${{ runner.temp }}/cochem-artifacts/Registry/*.sha256


          ${{ runner.temp }}/orca-evidence/controller-workflow.yml

          ${{ runner.temp }}/orca-evidence/acceptance-evidence-guard.py

          '
        if-no-files-found: error
        retention-days: 14
    - name: Remove licensed executables and download locations
      if: always()
      run: 'rm -rf -- "$RUNNER_TEMP/cochem-orca-install" "$RUNNER_TEMP/cochem-orca-download"

        '
