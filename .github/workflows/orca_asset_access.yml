name: Verify privately staged ORCA archive
run-name: CoChem ORCA archive ${{ inputs.asset_task_id }}

on:
  workflow_dispatch:
    inputs:
      asset_receipt:
        description: Canonical receipt from authorized Codespaces private staging
        required: true
        type: string
      asset_receipt_sha256:
        description: Exact staging receipt SHA-256
        required: true
        type: string
      asset_task_id:
        description: Exact task identity from the receipt
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-archive:
    if: ${{ github.event.repository.private && github.event.repository.owner.type == 'User' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify private ownership, receipt and approved asset bytes
        env:
          GH_TOKEN: ${{ github.token }}
          COCHEM_STAGING_RECEIPT: ${{ inputs.asset_receipt }}
          COCHEM_STAGING_RECEIPT_SHA256: ${{ inputs.asset_receipt_sha256 }}
          COCHEM_STAGING_TASK_ID: ${{ inputs.asset_task_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.consume_private_engine_asset import consume, load_workflow_receipt
          receipt = load_workflow_receipt('orca')
          root = Path(os.environ['RUNNER_TEMP']) / 'cochem-orca-access'
          root.mkdir(mode=0o700)
          consume(
              'orca',
              root / receipt['approved_distribution']['archive_name'],
              root / 'distribution.json',
              root / 'staging-receipt.json',
          )
          PY
          {
            echo 'Approved private staged archive access and SHA-256 passed.'
            echo ''
            echo 'Scope: archive integrity only; native installation and calculations have not run.'
            echo 'This job belongs to the student personal private repository and its Actions quota.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the job-local licensed archive and private descriptor
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/cochem-orca-access"
