name: ORCA private archive access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-archive:
    name: Download and verify the licensed ORCA archive
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require private archive access configuration
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          ASSET_CREDENTIAL_NAME: ${{ vars.COCHEM_ORCA_ASSET_CREDENTIAL }}
          ASSET_CREDENTIAL: ${{ secrets[vars.COCHEM_ORCA_ASSET_CREDENTIAL] }}
        run: |
          set -euo pipefail
          if [[ "$REPOSITORY_PRIVATE" != true ]]; then
            echo '::error::Licensed archive access requires a private project repository.'
            exit 1
          fi
          if [[ -z "$ASSET_CREDENTIAL_NAME" ]]; then
            echo '::error::Configure the private COCHEM_ORCA_ASSET_CREDENTIAL variable to select an authorized project secret.'
            exit 1
          fi
          if [[ ! "$ASSET_CREDENTIAL_NAME" =~ ^[a-zA-Z_][a-zA-Z0-9_]*$ ]]; then
            echo '::error::The private asset credential selector must be a valid secret identifier.'
            exit 1
          fi
          if [[ -z "$ASSET_CREDENTIAL" ]]; then
            echo '::error::The selected private ORCA asset credential is unavailable.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read the shared instructor-reviewed distribution identity
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.provision_orca import load_distribution_manifest
          manifest = load_distribution_manifest()
          fields = {
              'ORCA_ASSET_REPOSITORY': manifest['repository'],
              'ORCA_RELEASE_TAG': manifest['release_tag'],
              'ORCA_ARCHIVE_NAME': manifest['archive_name'],
              'ORCA_ARCHIVE_SHA256': manifest['sha256'],
          }
          with Path(os.environ['GITHUB_ENV']).open('a') as stream:
              stream.writelines(f'{key}={value}\n' for key, value in fields.items())
          PY
      - name: Check private access and the independently recorded checksum
        shell: bash
        env:
          GH_TOKEN: ${{ secrets[vars.COCHEM_ORCA_ASSET_CREDENTIAL] }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::The private ORCA asset credential needs Contents read access to the approved distribution repository."
            exit 1
          fi

          download_dir="$(mktemp -d "$RUNNER_TEMP/cochem-orca-access.XXXXXX")"
          trap 'rm -rf -- "$download_dir"' EXIT
          gh release download "$ORCA_RELEASE_TAG" \
            --repo "$ORCA_ASSET_REPOSITORY" \
            --pattern "$ORCA_ARCHIVE_NAME" \
            --dir "$download_dir"
          cd "$download_dir"
          printf '%s  %s\n' "${ORCA_ARCHIVE_SHA256,,}" "$ORCA_ARCHIVE_NAME" |
            sha256sum --check --strict
          {
            echo 'Private release download and independent SHA-256 verification passed.'
            echo ''
            echo 'Scope: archive access and integrity only. ORCA/MPI installation, BASE setup and physical calculations have not run.'
            echo 'The downloaded archive is removed; it is not published as an Actions artifact.'
          } >> "$GITHUB_STEP_SUMMARY"
