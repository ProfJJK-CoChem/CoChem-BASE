name: ORCA private archive access

on:
  workflow_dispatch:

env:
  PYTHONDONTWRITEBYTECODE: '1'

permissions:
  contents: read

jobs:
  verify-archive:
    name: Download and verify the licensed ORCA archive
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COCHEM_EXPECTED_REVISION: ${{ github.sha }}
    steps:
      - name: Validate licensed access route before checkout
        env:
          PROJECT_REPOSITORY: ${{ github.repository }}
          PROJECT_PRIVATE: ${{ github.event.repository.private }}
          PROJECT_FORK: ${{ github.event.repository.fork }}
          PROJECT_EVENT: ${{ github.event_name }}
          PROJECT_REF: ${{ github.ref }}
          PROJECT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PROJECT_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$PROJECT_FORK" != 'false' || ! "$PROJECT_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo '::error::Licensed jobs require an independent repository and an exact source commit.'
            exit 1
          fi
          if [[ "$PROJECT_REF" != refs/heads/* ]]; then
            echo '::error::Licensed jobs require a branch; tag and pull-request refs are prohibited.'
            exit 1
          fi
          if [[ "$PROJECT_REPOSITORY" == 'ProfJJK-CoChem/CoChem-BASE' ]]; then
            if [[ "$PROJECT_EVENT" != 'workflow_dispatch' && "$PROJECT_EVENT" != 'push' ]]; then
              echo '::error::Maintainer licensed jobs require dispatch or the registered integration pilot.'
              exit 1
            fi
          elif [[ "$PROJECT_PRIVATE" != 'true' || "$PROJECT_EVENT" != 'workflow_dispatch' ||
                  "$PROJECT_REF" != "refs/heads/$PROJECT_DEFAULT_BRANCH" ]]; then
            echo '::error::Student licensed jobs require an explicit default-branch dispatch in a private personal project.'
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Audit the reviewed source before distribution imports
        run: python -B -I -S ci_tools/base_ci.py audit --expected-revision "$COCHEM_EXPECTED_REVISION" --output "$RUNNER_TEMP/orca-access-evidence/source-audit"
      - name: Recheck the current project before licensed provisioning
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -B -I -S scripts/run_student_research.py --verify-project-only \
            --output "$RUNNER_TEMP/orca-access-evidence"
      - name: Read the shared instructor-reviewed distribution identity
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.provision_orca import load_distribution_manifest
          manifest = load_distribution_manifest()
          fields = {
              'ORCA_ASSET_REPOSITORY': manifest['repository'],
              'ORCA_RELEASE_TAG': manifest['release_tag'],
              'ORCA_ARCHIVE_NAME': manifest['archive_name'],
              'ORCA_ARCHIVE_SHA256': manifest['sha256'],
          }
          with Path(os.environ['GITHUB_ENV']).open('a') as stream:
              stream.writelines(f'{key}={value}\n' for key, value in fields.items())
          PY
      - name: Check private access and the independently recorded checksum
        shell: bash
        env:
          GH_TOKEN: ${{ secrets[vars.COCHEM_ORCA_ACCESS_SECRET] }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::The instructor-configured archive credential needs Contents read access to $ORCA_ASSET_REPOSITORY."
            exit 1
          fi

          download_dir="$(mktemp -d "$RUNNER_TEMP/cochem-orca-access.XXXXXX")"
          trap 'rm -rf -- "$download_dir"' EXIT
          gh release download "$ORCA_RELEASE_TAG" \
            --repo "$ORCA_ASSET_REPOSITORY" \
            --pattern "$ORCA_ARCHIVE_NAME" \
            --dir "$download_dir"
          cd "$download_dir"
          printf '%s  %s\n' "${ORCA_ARCHIVE_SHA256,,}" "$ORCA_ARCHIVE_NAME" |
            sha256sum --check --strict
          {
            echo 'Private release download and independent SHA-256 verification passed.'
            echo ''
            echo 'Scope: archive access and integrity only. ORCA/MPI installation, BASE setup and physical calculations have not run.'
            echo 'The downloaded archive is removed; it is not published as an Actions artifact.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve source integrity evidence without licensed files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orca-access-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/orca-access-evidence/
          if-no-files-found: error
          retention-days: 14
