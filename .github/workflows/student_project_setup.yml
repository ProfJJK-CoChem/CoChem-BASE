name: CoChem project setup check
run-name: CoChem setup ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Identifier generated by BASE for this setup check
        required: true
        type: string

permissions:
  contents: read

jobs:
  setup:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event.repository.private == true || github.repository == 'ProfJJK-CoChem/CoChem-BASE')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read setup settings without disclosing credentials
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SETUP_REQUEST_ID: ${{ inputs.request_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          COCHEM_APPROVED_BASE_SHA: ${{ vars.COCHEM_APPROVED_BASE_SHA }}
          COCHEM_COURSE_CHANNEL: ${{ vars.COCHEM_COURSE_CHANNEL }}
          COCHEM_SOURCE_AVAILABLE: ${{ secrets[vars.COCHEM_SOURCE_ACCESS_SECRET] != '' }}
          COCHEM_ORCA_AVAILABLE: ${{ secrets[vars.COCHEM_ORCA_ACCESS_SECRET] != '' }}
          COCHEM_CFOUR_AVAILABLE: ${{ secrets[vars.COCHEM_CFOUR_ACCESS_SECRET] != '' }}
        run: python3 -B -I -S scripts/check_student_project_setup.py --output "$RUNNER_TEMP/cochem-project-setup/project-setup.json"
      - name: Return setup status to BASE
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cochem-setup-${{ inputs.request_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cochem-project-setup/project-setup.json
          if-no-files-found: error
          retention-days: 1
