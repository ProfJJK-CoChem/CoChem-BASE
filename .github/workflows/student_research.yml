name: CoChem student research
run-name: CoChem student ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: BASE-generated immutable request UUID
        required: true
        type: string
      request_sha256:
        description: SHA-256 of the canonical data-only request
        required: true
        type: string
      request_base64:
        description: BASE-generated structures and scientific settings (no commands)
        required: true
        type: string

      admission_anchor:
        description: BASE-generated exact saved research dispatch commit (empty for a probe)
        required: false
        default: ''
        type: string

# Calculations never need write access to source, students' reports or secrets.
env:
  PYTHONDONTWRITEBYTECODE: '1'

permissions:
  contents: read

jobs:
  admission:
    # A changed default branch/source hash is rejected again by request preflight.
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event.repository.private == true || github.repository == 'ProfJJK-CoChem/CoChem-BASE')
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      probe: ${{ steps.route.outputs.probe }}
    defaults:
      run:
        working-directory: worker
    env:
      REQUEST_ID: ${{ inputs.request_id }}
      REQUEST_SHA256: ${{ inputs.request_sha256 }}
      REQUEST_BASE64: ${{ inputs.request_base64 }}
      REQUEST_ADMISSION_ANCHOR: ${{ inputs.admission_anchor }}
      GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      COCHEM_HEADLESS: '1'
      COCHEM_CPU_ALLOCATION_POLICY: github_hosted_vcpus
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Set job-local runtime paths
        working-directory: ${{ github.workspace }}
        run: |
          echo "COCHEM_ADMISSION_JOB_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          echo "COCHEM_ARTIFACT_DIR=$RUNNER_TEMP/cochem-student-runtime" >> "$GITHUB_ENV"
          echo "COCHEM_CONFIG=$RUNNER_TEMP/cochem-student-runtime/Registry/cochem_system_config.json" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: assignment
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify submitted structures, identity and finite resource limits
        id: request
        working-directory: assignment
        run: |
          python scripts/run_student_research.py --preflight-only \
            --output "$RUNNER_TEMP/cochem-student-evidence"
      - name: Verify the instructor-approved canonical worker revision
        working-directory: assignment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COCHEM_APPROVED_BASE_SHA: ${{ vars.COCHEM_APPROVED_BASE_SHA }}
          COCHEM_COURSE_CHANNEL: ${{ vars.COCHEM_COURSE_CHANNEL }}
        run: |
          python scripts/run_student_research.py --approve-worker-only \
            --output "$RUNNER_TEMP/cochem-student-evidence"
      - name: Obtain the exact canonical BASE worker without changing student files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ProfJJK-CoChem/CoChem-BASE
          ref: ${{ steps.request.outputs.worker_sha }}
          path: worker
          token: ${{ github.token }}
          persist-credentials: false
      - name: Audit the approved BASE source before application imports
        env:
          COCHEM_EXPECTED_REVISION: ${{ steps.request.outputs.worker_sha }}
        run: python -B -I -S ci_tools/base_ci.py audit --expected-revision "$COCHEM_EXPECTED_REVISION" --output "$RUNNER_TEMP/cochem-student-audit"
      - name: Revalidate scientific capabilities and resources in the approved worker
        id: worker
        run: |
          python scripts/run_student_research.py --verify-worker-only \
            --output "$RUNNER_TEMP/cochem-student-evidence"
      - name: Recheck the current private project before provisioning access
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -B scripts/run_student_research.py --verify-project-only \
            --output "$RUNNER_TEMP/cochem-student-evidence"
      - name: Verify this exact admitted run before publishing the route
        if: steps.worker.outputs.probe != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -B scripts/run_student_research.py --verify-admission-only --admission-wait \
            --output "$RUNNER_TEMP/cochem-student-evidence"
      - name: Publish the canonical admitted request route
        id: route
        env:
          VERIFIED_PROBE: ${{ steps.worker.outputs.probe }}
        run: |
          set -euo pipefail
          case "$VERIFIED_PROBE" in
            true|false) printf 'probe=%s\n' "$VERIFIED_PROBE" >> "$GITHUB_OUTPUT" ;;
            *) echo '::error::Canonical worker did not admit a valid request route.'; exit 1 ;;
          esac
      - name: Seal honest admission failure diagnostics
        id: failure_publication
        if: always() && steps.request.outcome == 'success' && steps.route.outcome != 'success'
        working-directory: ${{ github.workspace }}
        run: |
          python -B - <<'PY'
          import os, runpy
          from pathlib import Path
          worker = runpy.run_path('assignment/scripts/run_student_research.py')
          contract = worker['contract']
          output = Path(os.environ['RUNNER_TEMP']) / 'cochem-student-evidence'
          def record(name):
              with (output / name).open('rb') as stream:
                  raw = stream.read(4 * 1024 * 1024 + 1)
              if len(raw) > 4 * 1024 * 1024:
                  raise ValueError('Admission publication metadata exceeds its bound')
              return contract.strict_json(raw)
          request = contract.decode_transport_request(os.environ['REQUEST_BASE64'], os.environ['REQUEST_SHA256'])
          saved_request = record('request.json')
          if (contract.canonical_json(request) != contract.canonical_json(saved_request)
                  or request['request_id'] != os.environ['REQUEST_ID']
                  or request['repository'] != os.environ['GITHUB_REPOSITORY']
                  or request['source_sha'] != os.environ['GITHUB_SHA']
                  or os.environ['GITHUB_REF'] != 'refs/heads/' + os.environ['DEFAULT_BRANCH']):
              raise ValueError('Admission publication request identity changed')
          expected = worker['_identity'](request)
          identity = ('request_id', 'repository', 'source_sha', 'worker_source_sha',
                      'payload_sha256', 'run_id', 'run_attempt')
          def verify_report(status):
              report = record('student-result.json')
              if (report.get('schema_version') != 'cochem.student-result/1'
                      or report.get('status') != status or report.get('operation_performed') is not False
                      or report.get('capability_probe_performed', False) is not False
                      or any(type(report.get(key)) is not int for key in ('run_id', 'run_attempt'))
                      or any(report.get(key) != expected[key] for key in identity)):
                  raise ValueError('Admission may publish only its own unexecuted failed request')
          verify_report('prepared')
          worker['finalize'](output)
          verify_report('failed')
          manifest = record('publication-manifest.json')
          if (manifest.get('schema_version') != 'cochem.student-publication/1'
                  or any(type(manifest.get(key)) is not int for key in ('run_id', 'run_attempt'))
                  or any(manifest.get(key) != expected[key] for key in identity)):
              raise ValueError('Admission failure manifest identity changed')
          PY
      - name: Return the exact request's sealed admission failure to BASE
        if: always() && steps.request.outcome == 'success' && steps.route.outcome != 'success' && steps.failure_publication.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cochem-student-${{ inputs.request_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cochem-student-evidence/
          if-no-files-found: error
          retention-days: 14
  research:
    needs: admission
    concurrency:
      group: ${{ needs.admission.outputs.probe == 'true' && format('cochem-student-probe-{0}', github.repository) || format('cochem-student-research-{0}', github.repository) }}
      cancel-in-progress: false
    # A changed default branch/source hash is rejected again by request preflight.
    if: >-
      needs.admission.result == 'success' &&
      (needs.admission.outputs.probe == 'true' || needs.admission.outputs.probe == 'false') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event.repository.private == true || github.repository == 'ProfJJK-CoChem/CoChem-BASE')
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: worker
    env:
      REQUEST_ID: ${{ inputs.request_id }}
      REQUEST_SHA256: ${{ inputs.request_sha256 }}
      REQUEST_BASE64: ${{ inputs.request_base64 }}
      REQUEST_ADMISSION_ANCHOR: ${{ inputs.admission_anchor }}
      GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      COCHEM_HEADLESS: '1'
      COCHEM_CPU_ALLOCATION_POLICY: github_hosted_vcpus
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Set job-local runtime paths
        working-directory: ${{ github.workspace }}
        run: |
          echo "COCHEM_ADMISSION_JOB_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          echo "COCHEM_ARTIFACT_DIR=$RUNNER_TEMP/cochem-student-runtime" >> "$GITHUB_ENV"
          echo "COCHEM_CONFIG=$RUNNER_TEMP/cochem-student-runtime/Registry/cochem_system_config.json" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: assignment
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify submitted structures, identity and finite resource limits
        id: request
        working-directory: assignment
        run: |
          python scripts/run_student_research.py --preflight-only \
            --output "$RUNNER_TEMP/cochem-student-evidence"
      - name: Verify the instructor-approved canonical worker revision
        working-directory: assignment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COCHEM_APPROVED_BASE_SHA: ${{ vars.COCHEM_APPROVED_BASE_SHA }}
          COCHEM_COURSE_CHANNEL: ${{ vars.COCHEM_COURSE_CHANNEL }}
        run: |
          python scripts/run_student_research.py --approve-worker-only \
            --output "$RUNNER_TEMP/cochem-student-evidence"
      - name: Obtain the exact canonical BASE worker without changing student files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ProfJJK-CoChem/CoChem-BASE
          ref: ${{ steps.request.outputs.worker_sha }}
          path: worker
          token: ${{ github.token }}
          persist-credentials: false
      - name: Audit the approved BASE source before application imports
        env:
          COCHEM_EXPECTED_REVISION: ${{ steps.request.outputs.worker_sha }}
        run: python -B -I -S ci_tools/base_ci.py audit --expected-revision "$COCHEM_EXPECTED_REVISION" --output "$RUNNER_TEMP/cochem-student-audit"
      - name: Revalidate scientific capabilities and resources in the approved worker
        id: worker
        run: |
          python scripts/run_student_research.py --verify-worker-only \
            --output "$RUNNER_TEMP/cochem-student-evidence"
      - name: Bind the canonical worker route to the admitted request
        env:
          ADMITTED_PROBE: ${{ needs.admission.outputs.probe }}
          VERIFIED_PROBE: ${{ steps.worker.outputs.probe }}
        run: |
          set -euo pipefail
          case "$ADMITTED_PROBE" in
            true|false) ;;
            *) echo '::error::Admission did not provide a valid request route.'; exit 1 ;;
          esac
          case "$VERIFIED_PROBE" in
            true|false) ;;
            *) echo '::error::Canonical worker did not verify a valid request route.'; exit 1 ;;
          esac
          if [[ "$ADMITTED_PROBE" != "$VERIFIED_PROBE" ]]; then
            echo '::error::The canonical request route differs from admission; no protected operation was started.'
            exit 1
          fi
      - name: Recheck the current private project before provisioning access
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -B scripts/run_student_research.py --verify-project-only \
            --output "$RUNNER_TEMP/cochem-student-evidence"
      - name: Recheck this exact research binding and Stop before protected work
        if: steps.worker.outputs.probe != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -B scripts/run_student_research.py --verify-admission-only \
            --output "$RUNNER_TEMP/cochem-student-evidence"
      - name: Install native prerequisites on the disposable runner
        if: steps.worker.outputs.probe != 'true'
        env:
          RUNNER_HOST_KIND: ${{ runner.environment }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_HOST_KIND" != 'github-hosted' || "$RUNNER_OS" != 'Linux' ]]; then
            echo '::error::Native provisioning is restricted to disposable GitHub-hosted Linux runners.'
            exit 1
          fi
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/ghc
          sudo apt-get update
          sudo apt-get install --yes build-essential libgfortran5 \
            libegl1 libgl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libdbus-1-3
      - name: Provision ORCA only when this operation requests it
        id: orca_install
        if: steps.worker.outputs.orca == 'true'
        uses: ./worker/.github/actions/setup-orca
        with:
          asset-token: ${{ secrets[vars.COCHEM_ORCA_ACCESS_SECRET] }}
      - name: Provision CFOUR only when this operation requests it
        id: cfour_install
        if: steps.worker.outputs.cfour == 'true'
        uses: ./worker/.github/actions/setup-cfour
        with:
          asset-token: ${{ secrets[vars.COCHEM_CFOUR_ACCESS_SECRET] }}
          required: 'true'
      - name: Install an explicitly requested native CREST sampler
        if: steps.worker.outputs.crest == 'true'
        run: |
          python scripts/install_free_engines.py \
            --root "$COCHEM_ARTIFACT_DIR/free-engines" --engines crest \
            --output "$RUNNER_TEMP/cochem-student-evidence/crest-installation.json"
          echo "CREST_CMD=$COCHEM_ARTIFACT_DIR/free-engines/crest/crest/crest" >> "$GITHUB_ENV"
          echo "$COCHEM_ARTIFACT_DIR/free-engines/crest/crest" >> "$GITHUB_PATH"
      - name: Provision the exact free Quantum ESPRESSO build when requested
        if: steps.worker.outputs.qe == 'true'
        run: |
          sudo apt-get install --yes liblapack3 libblas3 libfftw3-double3 libopenmpi-dev libgomp1
          python .scripts/install_qe_paw.py --prefix "$COCHEM_ARTIFACT_DIR/qe" \
            --pseudo-dir "$COCHEM_ARTIFACT_DIR/qe-example-pseudos" \
            > "$RUNNER_TEMP/cochem-student-evidence/qe-installation.log"
          cp "$COCHEM_ARTIFACT_DIR/qe/installation-manifest.json" \
            "$RUNNER_TEMP/cochem-student-evidence/qe-installation.json"
          echo "COCHEM_QE_BIN=$COCHEM_ARTIFACT_DIR/qe/usr/bin/pw.x" >> "$GITHUB_ENV"
      - name: Install BASE, free engines and every Stage 0 phase
        if: steps.worker.outputs.probe != 'true'
        env:
          COCHEM_MODULES: ''
        run: |
          set -euo pipefail
          if python scripts/hosted_dashboard.py setup --min-disk-space-gb 1 \
            > "$RUNNER_TEMP/cochem-student-evidence/stage0-setup.log" 2>&1; then
            tail -n 20 "$RUNNER_TEMP/cochem-student-evidence/stage0-setup.log"
          else
            status=$?
            tail -n 80 "$RUNNER_TEMP/cochem-student-evidence/stage0-setup.log"
            exit "$status"
          fi
      - name: Create and authorize the actual PySCF calculation silo when requested
        if: steps.worker.outputs.pyscf == 'true'
        run: |
          "$COCHEM_ARTIFACT_DIR/ui-env/bin/python" - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from scripts.hosted_dashboard import runtime_environment, setup_build_environment
          artifacts = Path(os.environ['COCHEM_ARTIFACT_DIR'])
          manifest = artifacts / 'dashboard/deployment_manifest.json'
          manifest.write_text(json.dumps({'selected_repositories':['CoChem-BASE'],
              'requested_silos':['cochem_core_silo','cochem_ui_silo','cochem_calc_silo']})+'\n')
          env = setup_build_environment(runtime_environment(artifacts))
          with (Path(os.environ['RUNNER_TEMP'])/'cochem-student-evidence/pyscf-stage0-setup.log').open('w') as log:
              subprocess.run([str(artifacts/'ui-env/bin/python'),'cli.py','setup','--all',
                  '--artifact-dir',str(artifacts),'--min-disk-space-gb','1','--json'],
                  env=env,stdout=log,stderr=subprocess.STDOUT,check=True)
          PY
      - name: Retrieve and verify the student's sealed reference or Hessian inputs
        if: steps.worker.outputs.scientific_inputs == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          "$COCHEM_ARTIFACT_DIR/ui-env/bin/python" scripts/run_student_research.py \
            --download-scientific-inputs --output "$RUNNER_TEMP/cochem-student-evidence"
      - name: Reparse original molecular or periodic inputs and authenticate the PAW files
        if: steps.worker.outputs.data_inputs == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          "$COCHEM_ARTIFACT_DIR/ui-env/bin/python" scripts/run_student_research.py \
            --download-data-inputs --output "$RUNNER_TEMP/cochem-student-evidence"
      - name: Check optional licensed archive access without installing an engine
        if: steps.worker.outputs.probe == 'true'
        env:
          COCHEM_ORCA_ASSET_CREDENTIAL: ${{ secrets[vars.COCHEM_ORCA_ACCESS_SECRET] }}
          COCHEM_CFOUR_ASSET_CREDENTIAL: ${{ secrets[vars.COCHEM_CFOUR_ACCESS_SECRET] }}
        run: |
          python scripts/run_student_research.py --capability-probe \
            --output "$RUNNER_TEMP/cochem-student-evidence"
      - name: Install the selected reviewed providers without exposing readers to execution
        if: steps.worker.outputs.modules != ''
        env:
          COCHEM_SOURCE_CREDENTIAL: ${{ secrets[vars.COCHEM_SOURCE_ACCESS_SECRET] }}
          MODULE_IDS: ${{ steps.worker.outputs.modules }}
        run: |
          "$COCHEM_ARTIFACT_DIR/ui-env/bin/python" - <<'PY'
          import json, os
          from pathlib import Path
          from cochem_base.interfaces.student_setup import StudentSetupService
          # Public sources need no credential. Actual fetch, pin, origin and
          # installation checks determine readiness, including private denial.
          report = StudentSetupService(os.environ['COCHEM_ARTIFACT_DIR'], Path.cwd()).install_modules(
              os.environ['MODULE_IDS'].split())
          target = Path(os.environ['RUNNER_TEMP']) / 'cochem-student-evidence/module-installation.json'
          target.write_text(json.dumps(report, indent=2, allow_nan=False) + '\n')
          print(json.dumps({name: item['status'] for name, item in report['modules'].items()}))
          if not report['ready']:
              raise SystemExit('A required provider installation failed; no scientific operation was run.')
          PY
      - name: Recheck exact request and Stop immediately before execution
        if: steps.worker.outputs.probe != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -B scripts/run_student_research.py --verify-admission-only \
            --output "$RUNNER_TEMP/cochem-student-evidence"
      - name: Run the requested native calculation or reviewed scientific provider
        if: steps.worker.outputs.probe != 'true'
        run: |
          "$COCHEM_ARTIFACT_DIR/ui-env/bin/python" scripts/run_student_research.py \
            --output "$RUNNER_TEMP/cochem-student-evidence" \
            --registry "$COCHEM_CONFIG" --module-root "$COCHEM_ARTIFACT_DIR/Modules"
      - name: Seal completed results or honest failure diagnostics
        if: always() && steps.request.outcome == 'success'
        working-directory: ${{ github.workspace }}
        env:
          COCHEM_ORCA_REQUESTED: ${{ steps.worker.outputs.orca }}
          COCHEM_CFOUR_REQUESTED: ${{ steps.worker.outputs.cfour }}
          COCHEM_ORCA_PROVISIONING_OUTCOME: ${{ steps.orca_install.outcome }}
          COCHEM_CFOUR_PROVISIONING_OUTCOME: ${{ steps.cfour_install.outcome }}
        run: |
          python assignment/scripts/run_student_research.py --finalize-only \
            --output "$RUNNER_TEMP/cochem-student-evidence"
      - name: Return the exact request's scientific artifacts to BASE
        if: always() && steps.request.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cochem-student-${{ inputs.request_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cochem-student-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Remove optional job-local licensed runtime distributions
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          rm -rf -- "$RUNNER_TEMP/cochem-orca-install" "$RUNNER_TEMP/cochem-orca-download" \
            "$RUNNER_TEMP/cochem-cfour-install" "$RUNNER_TEMP/cochem-cfour-download"
