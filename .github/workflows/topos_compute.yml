name: TOPOS free-engine calculation through CoChem-BASE
run-name: ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Unique request correlation ID
        required: true
        type: string
      request_b64:
        description: Canonical TOPOS request JSON encoded as base64 (maximum 50 KB)
        required: true
        type: string
      request_sha256:
        description: Canonical request SHA-256
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: topos-compute-${{ inputs.dispatch_id }}
  cancel-in-progress: false

jobs:
  calculation:
    if: github.event.repository.private && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      TOPOS_DISPATCH_ID: ${{ inputs.dispatch_id }}
      TOPOS_REQUEST_B64: ${{ inputs.request_b64 }}
      TOPOS_REQUEST_SHA256: ${{ inputs.request_sha256 }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      QT_QPA_PLATFORM: offscreen
      COCHEM_HEADLESS: '1'
      COCHEM_CPU_ALLOCATION_POLICY: github_hosted_vcpus
    steps:
      - name: Preserve the dispatched controller checkout identity
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Checkout the reviewed scientific BASE implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ProfJJK-CoChem/CoChem-BASE
          ref: 705b9d54370d5089da286a02b7a1c4afdcbafec1
          path: .cochem-dependencies/base
          persist-credentials: false
      - name: Checkout the reviewed TOPOS implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ProfJJK-CoChem/CoChem-TOPOS
          ref: 6264cf08e76c37b04f111023161bf46f22c6e98b
          token: ${{ secrets.COCHEM_SOURCE_READ_TOKEN || secrets.BASE_SOURCE_READ_TOKEN }}
          path: .cochem-dependencies/topos
          persist-credentials: false
      - name: Checkout the reviewed TORQ consumer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ProfJJK-CoChem/CoChem-TORQ
          ref: 4f323800227dbde00ffb082bd6d9e44d851e1c7a
          token: ${{ secrets.COCHEM_SOURCE_READ_TOKEN || secrets.BASE_SOURCE_READ_TOKEN }}
          path: .cochem-dependencies/torq
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate and restrict the request before provisioning
        working-directory: .cochem-dependencies/topos
        run: |
          python -m pip install 'pydantic>=2.4'
          python - <<'PY'
          import base64
          import json
          import os
          from topos.actions.hosted_requirements import validate_submission
          from topos.models import RunRequest
          requirements = validate_submission(
              os.environ['TOPOS_REQUEST_B64'], os.environ['TOPOS_REQUEST_SHA256'],
              os.environ['TOPOS_DISPATCH_ID'])
          if requirements['requires_orca'] or not set(requirements['native_engines']) <= {'xtb', 'crest'}:
              raise ValueError('This controller provisions only the reviewed xTB and CREST pathways')
          original = json.loads(base64.b64decode(os.environ['TOPOS_REQUEST_B64'], validate=True))
          request = RunRequest.model_validate(original)
          if request.model_dump(mode='json') != original or request.calculation_environment != 'github-actions':
              raise ValueError('The controller requires an explicit canonical GitHub Actions request')
          if request.budget_seconds > 14400 or request.threads > 4 or request.memory_mb > 12288:
              raise ValueError('The request exceeds the reviewed hosted resource envelope')
          PY
      - name: Prepare the mandatory ecosystem and external artifact paths
        run: |
          echo "COCHEM_ARTIFACT_DIR=$RUNNER_TEMP/cochem-artifacts" >> "$GITHUB_ENV"
          echo "COCHEM_CONFIG=$RUNNER_TEMP/cochem-artifacts/Registry/cochem_system_config.json" >> "$GITHUB_ENV"
          echo "COCHEM_TORQ_ROOT=$GITHUB_WORKSPACE/.cochem-dependencies/torq" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install --yes build-essential libgfortran5
      - name: Install and audit all eleven mandatory ecosystem setup phases
        working-directory: .cochem-dependencies/topos
        run: |
          python scripts/setup_ecosystem.py \
            --base-root "$GITHUB_WORKSPACE/.cochem-dependencies/base" \
            --torq-root "$GITHUB_WORKSPACE/.cochem-dependencies/torq" \
            --artifacts "$COCHEM_ARTIFACT_DIR" --min-disk-space-gb 1
      - name: Execute the correlated TOPOS request through BASE
        working-directory: ${{ runner.temp }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          "$COCHEM_ARTIFACT_DIR/ui-env/bin/python" -m topos.actions.compute_worker \
            --output-root "$RUNNER_TEMP/topos-runs" --evidence-root "$RUNNER_TEMP/topos-evidence"
      - name: Retain scientific records and the correlation receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: topos-evidence-${{ inputs.dispatch_id }}
          path: ${{ runner.temp }}/topos-evidence/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
