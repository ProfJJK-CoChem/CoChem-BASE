# Pre-commit configuration for CoChem-BASE
# Standardizes code quality, deterministic PEP-8 formatting, and syntax validation.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-ast

  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8

  - repo: local
    hooks:
      - id: anti-spoof-audit
        name: Anti-Spoofing AST Integrity Sweep
        entry: pytest test_suite/test_anti_spoof_amnesty.py
        language: system
        pass_filenames: false
        always_run: true
