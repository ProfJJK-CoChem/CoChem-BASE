[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cochem-base"
version = "0.1.0"
description = "Core shell and hardware orchestrator for CoChem-Studio"
authors = [
    {name = "CoChem Team"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PySide6",
    "pluggy",
    "pydantic>=2",
    "pyqtgraph",
    "pyvista",
    "pyvistaqt",
    "vtk"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-qt",
    "ruff>=0.1.0",
    "mypy>=1.8.0"
]

[tool.setuptools.packages.find]
include = ["cochem_base*", "cochem_topos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", ".conda", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
explicit_package_bases = true
exclude = ["build/", "dist/"]
