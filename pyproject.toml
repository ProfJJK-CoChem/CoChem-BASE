[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "CoChem-BASE"
version = "1.1.0"
description = "CoChem ingestion, environment setup, validated calculation execution and student interface"
authors = [
    {name = "CoChem Team"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6",
    "cryptography>=50.0.1",
    "filelock>=3.32.5",
    "h5py>=3.9.0",
    "jinja2",
    "jax[cpu]==0.8.1",
    "mendeleev>=1.2.0",
    "mmh3>=5.3.0",
    "msgpack>=1.0",
    "networkx>=3.6.1",
    "numpy",
    "pluggy",
    "psutil",
    "pydantic>=2",
    "pyzmq>=25.1.0",
    "pyqtgraph",
    "pyvista",
    "pyvistaqt",
    "rdkit>=2026.3.5",
    "qcelemental>=0.51.2,<0.52",
    "scipy>=1.17.1",
    "tenacity>=8.2",
    "vtk",
]

[project.scripts]
cochem-cli = "cochem_base.cli:entrypoint"

[project.optional-dependencies]
dev = [
    "parsl",
    "pytest",
    "pytest-qt",
    "pytest-asyncio",
    "ruff>=0.1.0",
    "mypy>=1.8.0"
]
hpc = ["parsl"]
catalog = ["pyarrow", "pandas"]
symmetry = ["MolSym==1.2.0"]
scribe = ["google-genai>=2.28.0", "zstandard>=0.25.0", "tiktoken"]
ui = ["ase", "ipykernel", "ipywidgets", "jinja2", "matplotlib", "py3Dmol", "pynacl", "requests", "voila", "watchdog>=6.0.0"]

[tool.setuptools]
py-modules = ["cli", "Libraries.cochem_base_pes_store"]

[tool.setuptools.cmdclass]
build_py = "scripts.build_namespace.BaseNamespaceBuildPy"

[tool.setuptools.package-dir]
cochem = "src/cochem"
"cochem.torq" = "cochem/torq"
"cochem.ml.models" = "cochem/ml/models"
cochem_base = "src/cochem_base"
cochem_topos = "cochem_topos"
cochem_geom = "src/cochem_geom"
cochem_ml = "src/cochem_ml"
cochem_mobile = "src/cochem_mobile"
cochem_torq = "src/cochem_torq"
frontend = "frontend"
ui = "ui"
scripts = "scripts"
Libraries = "Libraries"

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["cochem", "cochem.*", "cochem_base*", "cochem_topos*", "cochem_geom*", "cochem_ml*", "cochem_mobile*", "cochem_torq*", "frontend", "frontend.*", "ui", "ui.*", "scripts", "scripts.*"]
exclude = ["*.egg-info*", "Libraries", "Libraries.*"]

[tool.pytest.ini_options]
testpaths = ["test_suite", "tests"]


[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", ".conda", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
explicit_package_bases = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
no_implicit_optional = true
mypy_path = ["typings", "setup"]

[[tool.mypy.overrides]]
module = [
    "cochem_setup_scribe.*",
    "PySide6.*",
    "pluggy.*",
    "pyqtgraph.*",
    "pyvista.*",
    "pyvistaqt.*",
    "vtk.*",
    "h5py.*",
    "numpy.*",
    "rich.*",
    "scipy.*",
    "psutil.*",
    "mendeleev.*",
    "ipywidgets.*",
    "networkx.*",
    "pynvml.*",
    "cochem.*",
    "Libraries.*",
    "cochem_bench.*",
    "bench_core.*",
    "cochem_geom_ingest_math.*",
    "cochem_geom_fitter_optim.*",
    "core_engine.cochem_topos_crusher.*",
    "cochem_topos_crusher.*",
    "cochem_torq_grid.*",
    "parsl.*",
    "molsym.*",
    "cochem_torq_orca.*",
    "pandas.*",
    "jinja2.*",
    "setuptools.*",
    "hdf5plugin.*",
    "zstandard.*"
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "rdkit",
    "rdkit.*"
]
ignore_missing_imports = true
ignore_errors = true
