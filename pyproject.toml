[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "CoChem-BASE"
version = "0.1.0"
description = "Core shell and hardware orchestrator for CoChem-Studio"
authors = [
    {name = "CoChem Team"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6",
    "cryptography>=50.0.1",
    "filelock>=3.32.5",
    "mendeleev>=1.2.0",
    "pluggy",
    "pydantic>=2",
    "pyqtgraph",
    "pyvista",
    "pyvistaqt",
    "vtk",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-qt",
    "ruff>=0.1.0",
    "mypy>=1.8.0"
]

[tool.setuptools.packages.find]
include = ["cochem_base*", "cochem_topos*"]

[tool.pytest.ini_options]
testpaths = ["test_suite", "tests"]


[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", ".conda", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
explicit_package_bases = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
no_implicit_optional = true
mypy_path = ["typings", "setup"]

[[tool.mypy.overrides]]
module = [
    "cochem_setup_scribe.*",
    "PySide6.*",
    "pluggy.*",
    "pyqtgraph.*",
    "pyvista.*",
    "pyvistaqt.*",
    "vtk.*",
    "h5py.*",
    "numpy.*",
    "rich.*",
    "scipy.*",
    "psutil.*",
    "mendeleev.*",
    "ipywidgets.*",
    "networkx.*",
    "pynvml.*",
    "cochem.*",
    "Libraries.*",
    "cochem_bench.*",
    "bench_core.*",
    "cochem_geom_ingest_math.*",
    "cochem_geom_fitter_optim.*",
    "core_engine.cochem_topos_crusher.*",
    "cochem_topos_crusher.*",
    "cochem_torq_grid.*",
    "parsl.*",
    "molsym.*",
    "cochem_torq_orca.*",
    "pandas.*",
    "jinja2.*",
    "setuptools.*"
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "rdkit",
    "rdkit.*"
]
ignore_missing_imports = true
ignore_errors = true
