[pytest]
pythonpath = . src cochem_topos export_utils cochem_bench ../CoChem-TOPOS
testpaths = tests/telemetry/test_mmap_ring_buffer.py tests/orchestration/test_sqlite_queue.py tests/core/test_process_reaper.py tests/core/test_mendeleev_invariants.py tests/telemetry/test_secret_masker.py tests/core/test_config.py tests/integration/test_base_core_orchestration_part1.py
addopts = -v --strict-markers
markers =
    asyncio: mark test as asyncio
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::RuntimeWarning


