[pytest]
pythonpath = . src cochem_topos export_utils cochem_bench ../CoChem-TOPOS
testpaths = tests/mobile/test_pwa_isolation.py tests/mobile/test_telemetry_locking.py tests/mobile/test_ring_buffer.py tests/mobile/test_vapid_push.py
addopts = -v --strict-markers
markers =
    asyncio: mark test as asyncio
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::RuntimeWarning


