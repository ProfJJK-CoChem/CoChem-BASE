[pytest]
pythonpath = . src cochem_topos export_utils cochem_bench ../CoChem-TOPOS
testpaths = tests/integration/test_base_data_and_storage_part1.py
addopts = -v --strict-markers
markers =
    asyncio: mark test as asyncio
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::RuntimeWarning


