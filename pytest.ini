[pytest]
pythonpath = . src cochem_topos export_utils cochem_bench ../CoChem-TOPOS
testpaths = tests/topos/test_models.py tests/topos/test_perception.py tests/topos/test_io.py tests/topos/test_forcefield.py tests/topos/test_fragmentation.py tests/topos/test_diff.py tests/topos/test_fingerprint.py
addopts = -v --strict-markers
markers =
    asyncio: mark test as asyncio
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::RuntimeWarning


