[pytest]
pythonpath = src src/cochem_base . Libraries cochem_topos export_utils cochem_bench ../CoChem-TOPOS ../CoChem-TORQ ../CoChem-TORQ/Libraries
testpaths =
    tests/torq/test_conformal_quench_intervention.py
    tests/ui/test_cli_run_and_gui_parity.py
    tests/ui/test_gui_spectroscopy_inspector.py
    tests/ui/test_scribe_dashboard_reconstruction.py
    tests/serialization/test_cfour_serializer_alignment.py
    tests/spectroscopy/test_mendeleev_isotopologue_engine.py
    tests/geometry/test_fragment_partitioner_constraints.py
addopts = -v --strict-markers
markers =
    asyncio: mark test as asyncio
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::RuntimeWarning
