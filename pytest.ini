[pytest]
pythonpath = . src cochem_topos export_utils cochem_bench ../CoChem-TOPOS
testpaths = tests/mobile/test_rdkit_physical_conformation.py tests/mobile/test_inorganic_assembly_tensors.py tests/mobile/test_webhook_tripartite_airgap.py tests/mobile/test_draco_state_journal.py
addopts = -v --strict-markers
markers =
    asyncio: mark test as asyncio
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::RuntimeWarning


