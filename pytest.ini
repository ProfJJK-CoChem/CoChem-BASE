[pytest]
pythonpath = src ../CoChem-TOPOS ../CoChem-TORQ ../CoChem-TORQ/Libraries src/cochem_base . Libraries cochem_topos export_utils cochem_bench
testpaths =
    tests/topos/test_non_initializing_gpu_telemetry.py
    tests/torq/test_ani2x_diagonal_mask_and_cutoff.py
    tests/torq/test_conformal_pooled_sample_size.py
    tests/torq/test_force_matching_loss_normalization.py
    tests/topos/test_goat_explore_daemon_execution.py
    tests/base/test_pip_monomial_group_invariance.py
    tests/base/test_krr_gram_conditioning_and_chunking.py
    tests/base/test_cochem_ml_unification.py
    tests/torq/test_delta_ml_d3_dispersion_augmentation.py
    tests/torq/test_committee_ensemble_vectorized_vmap.py
addopts = -v --strict-markers
markers =
    asyncio: mark test as asyncio
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::RuntimeWarning
