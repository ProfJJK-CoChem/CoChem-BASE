[pytest]
pythonpath = src src/cochem_base . Libraries cochem_topos export_utils cochem_bench ../CoChem-TOPOS ../CoChem-TORQ ../CoChem-TORQ/Libraries
testpaths =
    tests/base/test_active_learning_repulsion.py
    tests/telemetry/test_honest_hardware_telemetry.py
    tests/models/test_ani2x_cutoff_and_masking.py
    tests/ml/test_conformal_force_coverage.py
    tests/ml/test_force_matching_loss_scaling.py
    tests/topos/test_goat_explore_daemon_orchestration.py
    tests/base/test_pip_symmetry_invariance.py
    tests/base/test_krr_numerical_conditioning.py
    tests/ecosystem/test_ml_namespace_migration.py
    tests/torq/test_delta_ml_d3_dispersion.py
addopts = -v --strict-markers
markers =
    asyncio: mark test as asyncio
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::RuntimeWarning
