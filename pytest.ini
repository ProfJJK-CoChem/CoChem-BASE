[pytest]
pythonpath = . src cochem_topos export_utils cochem_bench ../CoChem-TOPOS
testpaths = tests/core/test_protocols.py tests/core/test_memory_guard.py tests/core/test_context.py tests/core/test_topology.py tests/core/test_serializer.py tests/concurrency/test_subprocess_broker.py tests/integration/test_base_core_orchestration_part2.py
addopts = -v --strict-markers
markers =
    asyncio: mark test as asyncio
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::RuntimeWarning


