[pytest]
pythonpath = . src cochem_topos export_utils cochem_bench ../CoChem-TOPOS
testpaths = tests/mobile/test_pwa_cache.py tests/cli/test_init_wizard.py tests/mobile/test_crash_reporter.py tests/mobile/test_system_health.py tests/engine/test_datamodule.py tests/integration/test_base_ui_web_part2.py
addopts = -v --strict-markers
markers =
    asyncio: mark test as asyncio
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::RuntimeWarning


