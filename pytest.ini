[pytest]
pythonpath = src ../CoChem-TOPOS ../CoChem-TORQ ../CoChem-TORQ/Libraries src/cochem_base . Libraries cochem_topos export_utils cochem_bench
testpaths =
    tests/base/test_slurm_single_node_binding.py
    tests/base/test_subprocess_tokenization_and_airgap.py
    tests/topos/test_cascade_promotion_integrity_gates.py
    tests/base/test_parsl_worker_resident_calculator_cache.py
    tests/base/test_segregated_gpu_scout_and_anchor_pools.py
    tests/base/test_dynamic_contention_budget_scaling.py
    tests/base/test_canonical_chain_unification.py
    tests/torq/test_active_learning_delta_ml_dag_integration.py
    tests/base/test_thread_safe_hdf5_sharding_and_swmr.py
    tests/torq/test_oet_client_fallback_alert.py
    tests/topos/test_chain_zero_synthetic_fallbacks.py
    tests/topos/test_concurrent_hdf5_rwfilelock.py
    tests/base/test_os_aware_gpu_scout_executor.py
    tests/base/test_execution_router_parsl_broker.py
    tests/base/test_subprocess_broker_interface_unification.py
    tests/torq/test_goat_multi_seed_parsl_parallelism.py
    tests/torq/test_mps_worker_daemon_lifecycle.py
    tests/torq/test_pipeline_cli_and_slurm_forwarding.py
    tests/topos/test_cascade_hdf5_lock_timeout_and_stale_recovery.py
addopts = -v --strict-markers
markers =
    asyncio: mark test as asyncio
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::RuntimeWarning
