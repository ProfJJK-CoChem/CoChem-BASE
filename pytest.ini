[pytest]
pythonpath = . src cochem_topos export_utils cochem_bench ../CoChem-TOPOS
testpaths = tests/hpc/test_models.py tests/runners/test_cuda_budget.py tests/hpc/test_slurm_generator.py tests/runners/test_mpi_supervisor.py tests/runners/test_async_process_runner.py tests/integration/test_base_hpc_scaling_part1.py
addopts = -v --strict-markers
markers =
    asyncio: mark test as asyncio
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::RuntimeWarning


