[pytest]
pythonpath = . src cochem_topos export_utils cochem_bench ../CoChem-TOPOS
testpaths = tests/topos/test_symmetry.py tests/topos/test_pharmacophore.py tests/topos/test_isotopes.py tests/topos/test_tpsa.py tests/topos/test_resonance.py tests/topos/test_sparsification.py
addopts = -v --strict-markers
markers =
    asyncio: mark test as asyncio
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::RuntimeWarning


