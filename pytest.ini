[pytest]
pythonpath = . Libraries src cochem_topos export_utils cochem_bench ../CoChem-TOPOS
testpaths =
    tests/test_chunk20_verification_suite.py
addopts = -v --strict-markers
markers =
    asyncio: mark test as asyncio
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::RuntimeWarning
