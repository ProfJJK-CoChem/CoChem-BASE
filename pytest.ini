[pytest]
pythonpath = src src/cochem_base . Libraries cochem_topos export_utils cochem_bench ../CoChem-TOPOS
testpaths =
    tests/core/test_rotational_constants_unification.py
    tests/core/test_cfour_vpt2_and_projection.py
    tests/core/test_dvr_nan_handling.py
    tests/core/test_pes_pip_and_asymptote.py
    tests/core/test_frozen_monomer_forces.py
    tests/calc/test_orca_input_tight_constraints.py
    tests/core/test_constants_provenance.py
addopts = -v --strict-markers
markers =
    asyncio: mark test as asyncio
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::RuntimeWarning
