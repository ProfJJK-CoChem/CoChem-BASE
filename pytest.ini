[pytest]
pythonpath = src ../CoChem-TOPOS ../CoChem-TORQ ../CoChem-TORQ/Libraries src/cochem_base . Libraries cochem_topos export_utils cochem_bench
testpaths =
    tests/torq/test_crest_binary_resolution_and_missing_data.py
    tests/torq/test_counterpoise_multijob_workflow.py
    tests/base/test_internal_coordinate_constraint_generation.py
    tests/topos/test_codata_energy_normalization_and_hdf5_locking.py
    tests/topos/test_two_stage_grid_dynamic_tightening.py
    tests/topos/test_screening_tier_hessian_deferral.py
    tests/torq/test_prohibition_calc_hess_true.py
    tests/torq/test_spin_contamination_validation.py
    tests/torq/test_cfour_bridge_registration_and_scratch_isolation.py
    tests/torq/test_goat_crest_conformer_union_pipeline.py
addopts = -v --strict-markers
markers =
    asyncio: mark test as asyncio
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::RuntimeWarning
