[pytest]
pythonpath = src src/cochem_base . Libraries cochem_topos export_utils cochem_bench ../CoChem-TOPOS ../CoChem-TORQ ../CoChem-TORQ/Libraries
testpaths =
    tests/topos/test_topos_tripartite_execution.py
    tests/geometry/test_vdw_distance_screener.py
    tests/torq/test_bspline_dvr_tunneling.py
    tests/torq/test_asymmetric_rotor_line_catalog.py
    tests/ui/test_torq_pipeline_controller_reactivity.py
    tests/base/test_preflight_and_log_parser.py
    tests/physics/test_maceoff_graph_partitioning.py
    tests/physics/test_oet_quintic_switching.py
    tests/base/test_delta_pes_dense_dft_krr.py
addopts = -v --strict-markers
markers =
    asyncio: mark test as asyncio
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::RuntimeWarning
