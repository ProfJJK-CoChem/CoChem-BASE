[pytest]
pythonpath = src src/cochem_base . Libraries cochem_topos export_utils cochem_bench ../CoChem-TOPOS ../CoChem-TORQ ../CoChem-TORQ/Libraries
testpaths =
    tests/ml/test_vectorized_committee_ensemble.py
    tests/torq/test_oet_fallback_provenance_alert.py
    tests/topos/test_chain_zero_mock_wavefunction.py
    tests/concurrency/test_hdf5_concurrent_staging.py
    tests/concurrency/test_gpu_scout_cross_platform_dispatch.py
    tests/base/test_execution_router_parsl_broker.py
    tests/concurrency/test_subprocess_broker_contract.py
    tests/torq/test_goat_multi_seed_concurrency.py
    tests/hpc/test_mps_worker_lifecycle.py
    tests/hpc/test_torq_pipeline_cli_slurm.py
addopts = -v --strict-markers
markers =
    asyncio: mark test as asyncio
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::RuntimeWarning
