[pytest]
pythonpath = src src/cochem_base . Libraries cochem_topos export_utils cochem_bench ../CoChem-TOPOS
testpaths =
    tests/concurrency/test_concurrency_chunk3.py
    tests/core/test_filesystem_remediation_chunk3.py
addopts = -v --strict-markers
markers =
    asyncio: mark test as asyncio
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::RuntimeWarning
