[pytest]
pythonpath = . src cochem_topos export_utils cochem_bench ../CoChem-TOPOS
testpaths = tests/topos/test_solvent.py tests/topos/test_canonicalization.py tests/test_cochem_topos_solvent.py tests/test_cochem_topos_canonicalization.py
addopts = -v --strict-markers
markers =
    asyncio: mark test as asyncio
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::RuntimeWarning


